        <details class="qa"><summary>정답 보기</summary><div class="a">${x.a}</div></details>
      </div>`).join("")}
  </div>`;
}

/* ───────── 고정 자료: 부하선은 왜 직선인가 ───────── */

function loadLineDiode(){
  const w=820, h=340, P={x:110,y:50,w:520,h:220};
  const VT=0.02585, Is=1e-12;
  const Vmax=1.0, Imax=0.012;
  const X = v => P.x + v/Vmax*P.w;
  const Y = i => P.y + P.h - i/Imax*P.h;
  const E=1.0, Rk=100;                    /* E=1V, R=100Ω → 절편 10mA */
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="다이오드 특성곡선과 부하선이 만나는 동작점">`;
  s += `<line x1="${P.x}" y1="${P.y-10}" x2="${P.x}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<line x1="${P.x}" y1="${P.y+P.h}" x2="${P.x+P.w+20}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<text x="${P.x-12}" y="${P.y-2}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">전류 I</text>`;
  s += `<text x="${P.x+P.w+16}" y="${P.y+P.h+22}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">다이오드 전압 V →</text>`;
  /* 다이오드 곡선 */
  let d="";
  for(let i=0;i<=300;i++){ const v=Vmax*i/300, ii=Is*(Math.exp(v/VT)-1); if(ii>Imax) break; d+=(d?"L":"M")+X(v).toFixed(1)+" "+Y(ii).toFixed(1); }
  s += `<path d="${d}" fill="none" stroke="${VIZ.ink}" stroke-width="2.8"/>`;
  s += `<text x="${X(0.83)}" y="${Y(0.0105)}" font-size="12.5" font-weight="800" fill="${VIZ.ink}">다이오드가 할 수 있는 것</text>`;
  /* 부하선 */
  s += `<line x1="${X(0)}" y1="${Y(E/Rk)}" x2="${X(E)}" y2="${Y(0)}" stroke="${VIZ.accent}" stroke-width="2.8"/>`;
  s += `<circle cx="${X(0)}" cy="${Y(E/Rk)}" r="5" fill="${VIZ.accent}"/>`;
  s += `<circle cx="${X(E)}" cy="${Y(0)}" r="5" fill="${VIZ.accent}"/>`;
  s += `<text x="${X(0)+10}" y="${Y(E/Rk)-8}" font-size="11.5" font-weight="800" fill="${VIZ.accent}">V=0 이면 I = E/R</text>`;
  s += `<text x="${X(E)-6}" y="${Y(0)+20}" text-anchor="end" font-size="11.5" font-weight="800" fill="${VIZ.accent}">I=0 이면 V = E</text>`;
  s += `<text x="${X(0.42)}" y="${Y(0.0072)}" font-size="12.5" font-weight="800" fill="${VIZ.accent}">회로가 허락하는 것 (부하선)</text>`;
  /* Q점: 수치 해 */
  let vq=0.7;
  for(let k=0;k<80;k++){ const f=Is*(Math.exp(vq/VT)-1)-(E-vq)/Rk; const df=Is/VT*Math.exp(vq/VT)+1/Rk; vq-=f/df; }
  const iq=(E-vq)/Rk;
  s += `<line x1="${X(vq)}" y1="${Y(iq)}" x2="${X(vq)}" y2="${P.y+P.h}" stroke="#0f9d6e" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  s += `<line x1="${P.x}" y1="${Y(iq)}" x2="${X(vq)}" y2="${Y(iq)}" stroke="#0f9d6e" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  s += `<circle cx="${X(vq)}" cy="${Y(iq)}" r="8" fill="#0f9d6e" stroke="#fff" stroke-width="2.4"/>`;
  s += `<text x="${X(vq)+14}" y="${Y(iq)-10}" font-size="14" font-weight="800" fill="#0f9d6e">Q</text>`;
  s += `<text x="${X(vq)+14}" y="${Y(iq)+8}" font-size="11.5" fill="#0f9d6e">동작점 — 두 조건을 동시에 만족</text>`;
  s += `<text x="410" y="${h-10}" text-anchor="middle" font-size="12" fill="${VIZ.sub}">소자의 성질(검은 곡선)과 회로의 구속(파란 직선)을 <tspan font-weight="800">동시에</tspan> 만족하는 점은 교점 하나뿐입니다.</text>`;
  return s+"</svg>";
}

function loadLineVary(){
  const w=820, h=300, P={x:100,y:40,w:620,h:200};
  const Vmax=1.0, Imax=0.03;
  const X = v => P.x + v/Vmax*P.w;
  const Y = i => P.y + P.h - i/Imax*P.h;
  const VT=0.02585, Is=1e-12;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="저항이 달라지면 부하선의 기울기가 달라지고 동작점이 이동한다">`;
  s += `<line x1="${P.x}" y1="${P.y-6}" x2="${P.x}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<line x1="${P.x}" y1="${P.y+P.h}" x2="${P.x+P.w+16}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  let d="";
  for(let i=0;i<=300;i++){ const v=Vmax*i/300, ii=Is*(Math.exp(v/VT)-1); if(ii>Imax) break; d+=(d?"L":"M")+X(v).toFixed(1)+" "+Y(ii).toFixed(1); }
  s += `<path d="${d}" fill="none" stroke="${VIZ.ink}" stroke-width="2.6"/>`;
  const E=1.0;
  [[50,"#e8552d","R 작게"],[100,VIZ.accent,"R 보통"],[300,"#0f9d6e","R 크게"]].forEach(([Rk,c,lb])=>{
    s += `<line x1="${X(0)}" y1="${Y(Math.min(E/Rk,Imax))}" x2="${X(E)}" y2="${Y(0)}" stroke="${c}" stroke-width="2.2"/>`;
    let vq=0.7;
    for(let k=0;k<80;k++){ const f=Is*(Math.exp(vq/VT)-1)-(E-vq)/Rk; const df=Is/VT*Math.exp(vq/VT)+1/Rk; vq-=f/df; }
    const iq=(E-vq)/Rk;
    s += `<circle cx="${X(vq)}" cy="${Y(iq)}" r="6" fill="${c}" stroke="#fff" stroke-width="2"/>`;
    s += `<text x="${X(0)+8}" y="${Y(Math.min(E/Rk,Imax))+(Rk===50?16:-6)}" font-size="11.5" font-weight="800" fill="${c}">${lb}</text>`;
  });
  s += `<text x="${X(E)-4}" y="${Y(0)+20}" text-anchor="end" font-size="11.5" font-weight="800" fill="${VIZ.sub}">V = E (공통)</text>`;
  s += `<text x="410" y="${h-32}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${VIZ.ink}">저항만 바꾸면 부하선의 <tspan fill="${VIZ.accent}">기울기</tspan>가 바뀝니다 — 오른쪽 끝은 언제나 V = E 입니다.</text>`;
  s += `<text x="410" y="${h-12}" text-anchor="middle" font-size="12" fill="${VIZ.muted}">전원 E를 바꾸면 선이 통째로 평행 이동합니다. 두 절편만 찍으면 부하선은 다 그린 것입니다.</text>`;
  return s+"</svg>";
}

function loadLineBJT(){
  const w=820, h=330, P={x:100,y:40,w:600,h:220};
  const Vcc=20, Icmax=0.010;
  const X = v => P.x + v/Vcc*P.w;
  const Y = i => P.y + P.h - i/Icmax*P.h;
  const Rc=2500;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BJT 출력 특성곡선 위에 직류 부하선을 긋고 동작점을 잡는 그림">`;
  s += `<line x1="${P.x}" y1="${P.y-6}" x2="${P.x}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<line x1="${P.x}" y1="${P.y+P.h}" x2="${P.x+P.w+16}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<text x="${P.x-12}" y="${P.y+2}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">I(C)</text>`;
  s += `<text x="${P.x+P.w+12}" y="${P.y+P.h+22}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">V(CE) →</text>`;
  /* 출력 특성 곡선들 */
  [0.001,0.002,0.003,0.004,0.005,0.006].forEach((ic,k)=>{
    let d="";
    for(let i=0;i<=200;i++){
      const v=Vcc*i/200;
      const val = ic*(1-Math.exp(-v/0.7))*(1+v/160);
      d+=(d?"L":"M")+X(v).toFixed(1)+" "+Y(val).toFixed(1);
    }
    s += `<path d="${d}" fill="none" stroke="#9db4d4" stroke-width="1.8"/>`;
    s += `<text x="${P.x+P.w+6}" y="${Y(ic*(1+Vcc/160))+4}" font-size="10.5" fill="${VIZ.muted}">I(B)${k+1}</text>`;
  });
  /* 부하선 */
  s += `<line x1="${X(0)}" y1="${Y(Vcc/Rc)}" x2="${X(Vcc)}" y2="${Y(0)}" stroke="${VIZ.accent}" stroke-width="2.8"/>`;
  s += `<text x="${X(0)+10}" y="${Y(Vcc/Rc)-8}" font-size="11.5" font-weight="800" fill="${VIZ.accent}">포화 쪽 끝: I = V(CC)/R(C)</text>`;
  s += `<text x="${X(Vcc)-6}" y="${Y(0)+20}" text-anchor="end" font-size="11.5" font-weight="800" fill="${VIZ.accent}">차단 쪽 끝: V = V(CC)</text>`;
  /* Q점 (가운데) */
  const vq=Vcc/2, iq=(Vcc-vq)/Rc;
  s += `<circle cx="${X(vq)}" cy="${Y(iq)}" r="8" fill="#0f9d6e" stroke="#fff" stroke-width="2.4"/>`;
  s += `<text x="${X(vq)+14}" y="${Y(iq)-8}" font-size="14" font-weight="800" fill="#0f9d6e">Q</text>`;
  /* 스윙 표시 */
  s += `<line x1="${X(vq)}" y1="${Y(iq)+26}" x2="${X(1.2)}" y2="${Y(iq)+26}" stroke="#0f9d6e" stroke-width="1.6" stroke-dasharray="3 3"/>`;
  s += `<line x1="${X(vq)}" y1="${Y(iq)+26}" x2="${X(Vcc-1)}" y2="${Y(iq)+26}" stroke="#0f9d6e" stroke-width="1.6" stroke-dasharray="3 3"/>`;
  s += `<text x="${X(vq)}" y="${Y(iq)+44}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f9d6e">Q를 가운데 두면 양쪽으로 흔들 여유가 가장 커진다</text>`;
  s += `<text x="410" y="${h-10}" text-anchor="middle" font-size="12" fill="${VIZ.sub}">4장의 바이어싱은 결국 <tspan font-weight="800">이 선 위 어디에 Q를 놓을 것인가</tspan>를 정하는 일입니다.</text>`;
  return s+"</svg>";
}

      <p class="calc-note">여기 어디에도 소자가 다이오드인지 트랜지스터인지에 대한 정보가 없다는 점이 핵심입니다.

    <p>그래서 <b>그래프를 겹쳐 그리는</b> 방법을 썼습니다. 제조사가 데이터시트에 특성곡선을 인쇄해 주면, 엔지니어는 그 위에 자를 대고 직선 하나를 그어 교점을 읽었습니다.
    당시 진공관 데이터시트에 특성곡선 그래프가 큼직하게 실려 있던 것은 장식이 아니라 <b>실제 계산 도구</b>였기 때문입니다.</p>

    답을 구하는 도구로서의 역할은 줄었지만, <b>왜 그렇게 되는지 보여 주는 도구</b>로서는 대체된 적이 없기 때문입니다.
    시뮬레이터는 "Q점은 6.2V"라고 알려 주지만, 저항을 키우면 왜 동작점이 내려가는지, 신호가 커지면 왜 윗부분부터 잘리는지는 말해 주지 않습니다.</p>
    <p>계산을 위해 태어난 방법이 <b>직관을 위해 살아남은</b> 셈입니다. 여러분이 4장에서 자를 대고 선을 긋는 이유가 여기 있습니다.</p>

/* 커패시터는 주파수에 따라 개방도 되고 단락도 된다 */
function capFreq(){
  const w=820, h=300, P={x:110,y:50,w:600,h:180};
  const X = e => P.x + (e+1)/7*P.w;          /* log10(f), -1 ~ 6 */
  const Y = e => P.y + P.h - (e+1)/7*P.h;    /* log10(Z) 역방향 */
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="커패시터 임피던스가 주파수에 따라 줄어드는 그래프">`;
  s += `<line x1="${P.x}" y1="${P.y-10}" x2="${P.x}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<line x1="${P.x}" y1="${P.y+P.h}" x2="${P.x+P.w+14}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<text x="${P.x-12}" y="${P.y-2}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">임피던스</text>`;
  s += `<text x="${P.x+P.w+10}" y="${P.y+P.h+22}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">주파수 →</text>`;
  let d="";
  for(let i=0;i<=200;i++){ const e=-1+7*i/200; d+=(d?"L":"M")+X(e).toFixed(1)+" "+Y(5-e).toFixed(1); }
  s += `<path d="${d}" fill="none" stroke="${VIZ.ink}" stroke-width="2.8"/>`;
  /* DC 영역 */
  s += `<rect x="${P.x}" y="${P.y-6}" width="90" height="${P.h+6}" fill="#fdeceb" opacity=".55"/>`;
  s += `<text x="${P.x+45}" y="${P.y+16}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b42318">DC (f≈0)</text>`;
  s += `<text x="${P.x+45}" y="${P.y+34}" text-anchor="middle" font-size="11.5" fill="#b42318">임피던스 무한대</text>`;
  s += `<text x="${P.x+45}" y="${P.y+52}" text-anchor="middle" font-size="12" font-weight="800" fill="#b42318">= 끊긴 것</text>`;
  /* 신호 영역 */
  s += `<rect x="${X(3)}" y="${P.y-6}" width="${P.w-X(3)+P.x}" height="${P.h+6}" fill="#e9f6ef" opacity=".6"/>`;
  s += `<text x="${X(4.6)}" y="${P.y+140}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0a7d57">신호 주파수 대역</text>`;
  s += `<text x="${X(4.6)}" y="${P.y+158}" text-anchor="middle" font-size="11.5" fill="#0a7d57">임피던스 거의 0</text>`;
  s += `<text x="${X(4.6)}" y="${P.y+176}" text-anchor="middle" font-size="12" font-weight="800" fill="#0a7d57">= 그냥 선</text>`;
  s += `<text x="410" y="${h-34}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${VIZ.ink}">같은 커패시터인데 DC에서는 개방, 신호 주파수에서는 단락으로 보입니다.</text>`;
  s += `<text x="410" y="${h-14}" text-anchor="middle" font-size="12" fill="${VIZ.muted}">부품이 바뀐 것이 아니라, 우리가 어떤 주파수의 눈으로 보느냐가 다를 뿐입니다.</text>`;
  return s+"</svg>";
}

/* DC 눈과 AC 눈 — 각 부품이 무엇으로 보이는가 */
function dcAcEyes(){
  const w=820, h=330;
  const rows=[
    {t:"커패시터", dc:"개방 (끊긴 선)", ac:"단락 (그냥 선)", why:"임피던스가 주파수에 반비례"},
    {t:"직류 전원 V(CC)", dc:"전압원 그대로", ac:"접지 (0 V)", why:"변하지 않으므로 신호 관점에서는 흔들림이 없다"},
    {t:"저항", dc:"그대로", ac:"그대로", why:"주파수와 무관"},
    {t:"트랜지스터", dc:"Q점을 정한다", ac:"r(e) 모델로 대체", why:"Q점에서의 접선 기울기가 곧 r(e)"},
  ];
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="같은 회로를 직류의 눈과 교류의 눈으로 볼 때 각 부품이 무엇으로 바뀌는지 정리한 표">`;
  s += `<rect x="230" y="30" width="200" height="34" rx="9" fill="#fdeceb" stroke="#e8552d" stroke-width="1.4"/>`;
  s += `<text x="330" y="52" text-anchor="middle" font-size="13.5" font-weight="800" fill="#b42318">DC의 눈으로 보면</text>`;
  s += `<rect x="450" y="30" width="200" height="34" rx="9" fill="#e9f6ef" stroke="#0f9d6e" stroke-width="1.4"/>`;
  s += `<text x="550" y="52" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0a7d57">AC의 눈으로 보면</text>`;
  rows.forEach((r,i)=>{
    const y = 86 + i*56;
    s += `<rect x="30" y="${y}" width="760" height="48" rx="9" fill="${i%2?"#fbfcfe":"#fff"}" stroke="${VIZ.grid}" stroke-width="1"/>`;
    s += `<text x="46" y="${y+22}" font-size="13" font-weight="800" fill="${VIZ.ink}">${r.t}</text>`;
    s += `<text x="46" y="${y+40}" font-size="11" fill="${VIZ.muted}">${r.why}</text>`;
    s += `<text x="330" y="${y+30}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b42318">${r.dc}</text>`;
    s += `<text x="550" y="${y+30}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a7d57">${r.ac}</text>`;
  });
  s += `<text x="410" y="${h-12}" text-anchor="middle" font-size="12" fill="${VIZ.sub}">회로가 두 개인 것이 아니라, <tspan font-weight="800">같은 회로를 두 번 다르게 보는</tspan> 것입니다.</text>`;
  return s+"</svg>";
}

/* r(e)는 곡선의 접선 기울기다 */
function reTangent(){
  const w=820, h=340, P={x:110,y:50,w:600,h:220};
  const VT=0.02585, Is=1e-14;
  const Vmax=0.75, Imax=0.006;
  const X = v => P.x + v/Vmax*P.w;
  const Y = i => P.y + P.h - i/Imax*P.h;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="지수 곡선 위 동작점에서의 접선 기울기가 소신호 저항이 되는 그림">`;
  s += `<line x1="${P.x}" y1="${P.y-10}" x2="${P.x}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<line x1="${P.x}" y1="${P.y+P.h}" x2="${P.x+P.w+14}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<text x="${P.x-12}" y="${P.y-2}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">전류</text>`;
  s += `<text x="${P.x+P.w+10}" y="${P.y+P.h+22}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">전압 →</text>`;
  let d="";
  for(let i=0;i<=300;i++){ const v=Vmax*i/300, ii=Is*(Math.exp(v/VT)-1); if(ii>Imax) break; d+=(d?"L":"M")+X(v).toFixed(1)+" "+Y(ii).toFixed(1); }
  s += `<path d="${d}" fill="none" stroke="${VIZ.ink}" stroke-width="2.8"/>`;
  /* Q점과 접선 */
  const vq=0.62, iq=Is*(Math.exp(vq/VT)-1), slope=iq/VT;
  const dv=0.075;
  s += `<line x1="${X(vq-dv)}" y1="${Y(iq-slope*dv)}" x2="${X(vq+dv)}" y2="${Y(Math.min(iq+slope*dv,Imax))}" stroke="${VIZ.accent}" stroke-width="2.4" stroke-dasharray="6 4"/>`;
  s += `<circle cx="${X(vq)}" cy="${Y(iq)}" r="7" fill="#0f9d6e" stroke="#fff" stroke-width="2.2"/>`;
  s += `<text x="${X(vq)-12}" y="${Y(iq)-14}" text-anchor="end" font-size="13.5" font-weight="800" fill="#0f9d6e">Q점</text>`;
  s += `<text x="${X(vq)-12}" y="${Y(iq)+4}" text-anchor="end" font-size="11.5" fill="#0f9d6e">DC 바이어싱이 정해 준 자리</text>`;
  s += `<text x="${X(vq)+16}" y="${Y(iq)+40}" font-size="12.5" font-weight="800" fill="${VIZ.accent}">이 접선의 기울기가 곧 소신호 저항</text>`;
  s += `<text x="${X(vq)+16}" y="${Y(iq)+58}" font-size="11.5" fill="${VIZ.accent}">기울기가 가파를수록 저항이 작다</text>`;
  /* 작은 신호 vs 큰 신호 */
  s += `<rect x="${X(vq-0.02)}" y="${P.y+8}" width="${X(vq+0.02)-X(vq-0.02)}" height="${P.h-8}" fill="#0f9d6e" opacity=".12"/>`;
  s += `<text x="${X(vq)}" y="${P.y+22}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0a7d57">작은 신호</text>`;
  s += `<text x="${X(vq)}" y="${P.y+38}" text-anchor="middle" font-size="10.5" fill="#0a7d57">곡선 ≈ 직선</text>`;
  s += `<text x="410" y="${h-30}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${VIZ.ink}">신호가 작아서 곡선의 아주 짧은 구간만 쓴다면, 그 구간은 직선이나 다름없습니다.</text>`;
  s += `<text x="410" y="${h-10}" text-anchor="middle" font-size="12" fill="${VIZ.muted}">그래서 비선형 소자를 저항 하나로 바꿔 놓고 풀 수 있습니다 — 이것이 '소신호' 해석입니다.</text>`;
  return s+"</svg>";
}

    그리고 신호를 곡선이 직선처럼 보이는 범위 안에 두는 것(5장)입니다. <b>부하선과 소신호 모델은 같은 문제의 두 얼굴</b>입니다.</p>

}

function ledSpectrum(){
  const w=820, h=320, B={x:80,y:90,w:660,h:56};
  const lam0=350, lam1=900;
  const X = l => B.x + (l-lam0)/(lam1-lam0)*B.w;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="가시광 스펙트럼 위에 재료별 LED 발광 파장을 표시한 그림">`;
  s += `<defs><linearGradient id="ldG" x1="0" x2="1"><stop offset="0" stop-color="#2b0b4a"/><stop offset="${((400-lam0)/(lam1-lam0)).toFixed(3)}" stop-color="#7c3aed"/><stop offset="${((470-lam0)/(lam1-lam0)).toFixed(3)}" stop-color="#2f6bff"/><stop offset="${((520-lam0)/(lam1-lam0)).toFixed(3)}" stop-color="#22c55e"/><stop offset="${((580-lam0)/(lam1-lam0)).toFixed(3)}" stop-color="#eab308"/><stop offset="${((640-lam0)/(lam1-lam0)).toFixed(3)}" stop-color="#ef4444"/><stop offset="${((760-lam0)/(lam1-lam0)).toFixed(3)}" stop-color="#4a1414"/><stop offset="1" stop-color="#241010"/></linearGradient></defs>`;
  s += `<rect x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="6" fill="url(#ldG)"/>`;
  [[400,"400"],[500,"500"],[600,"600"],[700,"700"],[800,"800"]].forEach(([l,t])=>{
    s += `<text x="${X(l)}" y="${B.y+B.h+18}" text-anchor="middle" font-size="11" fill="${VIZ.muted}">${t}</text>`;
  });
  s += `<text x="${B.x+B.w/2}" y="${B.y+B.h+36}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">파장 [nm] — 왼쪽일수록 에너지가 크다</text>`;
  s += `<text x="${X(370)}" y="${B.y-10}" text-anchor="middle" font-size="11" fill="${VIZ.muted}">자외선</text>`;
  s += `<text x="${X(840)}" y="${B.y-10}" text-anchor="middle" font-size="11" fill="${VIZ.muted}">적외선</text>`;
  const mats=[
    {l:870, t:"GaAs", d:"적외선 · 리모컨", up:false},
    {l:660, t:"AlGaInP", d:"빨강", up:true},
    {l:590, t:"AlGaInP", d:"노랑·주황", up:false},
    {l:525, t:"InGaN", d:"초록", up:true},
    {l:460, t:"InGaN", d:"파랑", up:false},
  ];
  mats.forEach(m=>{
    const x=X(m.l), ly = m.up ? B.y-26 : B.y+B.h+58;
    s += `<line x1="${x}" y1="${m.up?B.y-4:B.y+B.h+4}" x2="${x}" y2="${m.up?B.y-20:B.y+B.h+46}" stroke="${VIZ.sub}" stroke-width="1.2"/>`;
    s += `<text x="${x}" y="${m.up?ly:ly}" text-anchor="middle" font-size="12" font-weight="800" fill="${VIZ.ink}">${m.t}</text>`;

  return s+"</svg>";
}

function directIndirect(){
  const w=820, h=320;
  const panel=(ox,title,indirect,note,c)=>{
    const P={x:ox+40,y:70,w:290,h:180};
    let g = `<text x="${ox+185}" y="42" text-anchor="middle" font-size="14" font-weight="800" fill="${c}">${title}</text>`;
    g += `<line x1="${P.x}" y1="${P.y}" x2="${P.x}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.4"/>`;
    g += `<line x1="${P.x}" y1="${P.y+P.h}" x2="${P.x+P.w}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.4"/>`;
    g += `<text x="${P.x-8}" y="${P.y+6}" text-anchor="end" font-size="10.5" fill="${VIZ.muted}">E</text>`;
    /* 전도대 (아래로 볼록) */
    const cxTop = indirect ? P.x+P.w*0.72 : P.x+P.w*0.42;
    let d1="";
    for(let i=0;i<=60;i++){ const x=P.x+P.w*i/60; const y=P.y+34+Math.pow((x-cxTop)/70,2)*22; if(y>P.y+P.h-70) continue; d1+=(d1?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }
    g += `<path d="${d1}" fill="none" stroke="${VIZ.blue}" stroke-width="2.4"/>`;
    /* 가전자대 (위로 볼록), 꼭짓점은 항상 가운데 */
    const vxTop = P.x+P.w*0.42;
    let d2="";
    for(let i=0;i<=60;i++){ const x=P.x+P.w*i/60; const y=P.y+P.h-30-Math.pow((x-vxTop)/70,2)*20; if(y<P.y+70) continue; d2+=(d2?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }
    g += `<path d="${d2}" fill="none" stroke="#2a78d6" stroke-width="2.4"/>`;
    /* 전이 화살표 */
    const cy=P.y+34, vy=P.y+P.h-30;
    if(indirect){
      g += `<line x1="${vxTop}" y1="${vy}" x2="${cxTop}" y2="${cy}" stroke="#e8552d" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#diA)"/>`;
      g += `<text x="${(vxTop+cxTop)/2+6}" y="${(cy+vy)/2-10}" font-size="11" font-weight="800" fill="#e8552d">옆으로도 옮겨야 함</text>`;
    }else{
      g += `<line x1="${vxTop}" y1="${vy}" x2="${cxTop}" y2="${cy}" stroke="#0f9d6e" stroke-width="2.6" marker-end="url(#diB)"/>`;
      g += `<text x="${vxTop+10}" y="${(cy+vy)/2}" font-size="11" font-weight="800" fill="#0a7d57">곧바로 내려오며 빛</text>`;
    }
    g += `<circle cx="${cxTop}" cy="${cy}" r="5" fill="${VIZ.blue}"/>`;
    g += `<circle cx="${vxTop}" cy="${vy}" r="5" fill="#e8552d"/>`;
    g += `<text x="${ox+185}" y="${P.y+P.h+28}" text-anchor="middle" font-size="11.5" fill="${VIZ.sub}">${note}</text>`;
    return g;
  };
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="직접천이형과 간접천이형 반도체에서 전자가 내려올 때의 차이">`;
  s += `<defs><marker id="diA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8552d"/></marker>`;
  s += `<marker id="diB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f9d6e"/></marker></defs>`;
  s += panel(20, "직접천이형 — GaAs, InGaN", false, "전자가 제자리에서 곧장 내려오며 빛이 된다", "#0a7d57");
  s += panel(430, "간접천이형 — Si, Ge", true, "옆으로도 옮겨야 해서 빛 대신 열이 되기 쉽다", "#b42318");

  return s+"</svg>";
}

    let g = `<line x1="${W.x}" y1="${y0+34}" x2="${W.x+W.w}" y2="${y0+34}" stroke="${VIZ.grid}" stroke-width="1.2"/>`;
    g += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.4"/>`;
    g += `<text x="${W.x}" y="${y0-4}" font-size="12" font-weight="800" fill="${c}">${label}</text>`;
    return g;
  };
  s += wave(W.y, t=>Math.sin(t), "입력 — 위아래로 흔들린다", VIZ.blue);
  s += wave(W.y+96, t=>Math.abs(Math.sin(t)), "정류 후 — 아래쪽이 위로 접혔다", "#e8552d");
  s += wave(W.y+192, t=>{const b=Math.abs(Math.sin(t)); return Math.max(b, 0.86-0.10*((t/Math.PI)%1));}, "커패시터를 붙이면 — 거의 평평해진다", "#0f9d6e");
  s += `<text x="${W.x}" y="${h-10}" font-size="11.5" fill="${VIZ.muted}">남아 있는 잔물결이 리플입니다. 커패시터가 클수록 작아집니다.</text>`;
  return s+"</svg>";
}

/* ───────── 고정 자료: 데이터시트 읽는 법 ───────── */

/* 절대최대정격과 전기적 특성은 완전히 다른 표다 */
function dsTwoTables(){
  const w=820, h=310;
  const card=(x,title,sub,c,fill,lines,warn)=>{
    let g = `<rect x="${x}" y="50" width="360" height="220" rx="12" fill="${fill}" stroke="${c}" stroke-width="1.8"/>`;
    g += `<text x="${x+20}" y="82" font-size="14.5" font-weight="800" fill="${c}">${title}</text>`;
    g += `<text x="${x+20}" y="102" font-size="11.5" fill="${VIZ.sub}">${sub}</text>`;
    lines.forEach((ln,i)=>{
      g += `<text x="${x+20}" y="${132+i*24}" font-size="12.5" fill="#3f4855">${ln}</text>`;
    });
    g += `<text x="${x+20}" y="248" font-size="12" font-weight="800" fill="${c}">${warn}</text>`;
    return g;
  };
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="절대최대정격과 전기적 특성 표의 차이">`;
  s += `<text x="30" y="30" font-size="13.5" font-weight="800" fill="${VIZ.ink}">데이터시트에서 가장 많이 혼동되는 두 표</text>`;
  s += card(30, "Absolute Maximum Ratings", "절대최대정격", "#b42318", "#fdeceb",
    ["• 여기까지는 <b>망가지지 않는다</b>는 한계선","• 이 값에서 동작하라는 뜻이 절대 아니다","• 순간이라도 넘으면 소자가 죽는다","• 보통 절반 이하로 설계한다"],
    "→ '넘지 마라'는 선");
  s += card(430, "Electrical Characteristics", "전기적 특성", "#0a7d57", "#e9f6ef",
    ["• 정해진 조건에서 <b>실제로 이렇게 동작한다</b>","• 조건(전류·온도)이 반드시 함께 적혀 있다","• Min / Typ / Max 로 범위를 준다","• 설계 계산에 쓰는 값은 이쪽이다"],
    "→ '이렇게 동작한다'는 값");
  s += `<text x="410" y="${h-14}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${VIZ.ink}">최대정격 100V짜리 다이오드를 100V 회로에 쓰면 안 됩니다.</text>`;
  return s+"</svg>";
}

/* 조건 없는 숫자는 없다 */
function dsCondition(){
  const w=820, h=250;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="데이터시트의 값에는 항상 측정 조건이 함께 적혀 있다">`;
  s += `<text x="30" y="32" font-size="13.5" font-weight="800" fill="${VIZ.ink}">데이터시트 한 줄을 뜯어보면</text>`;
  s += `<rect x="60" y="56" width="700" height="60" rx="10" fill="#f7f9fc" stroke="${VIZ.grid}" stroke-width="1.4"/>`;
  s += `<text x="90" y="94" font-size="17" font-weight="800" fill="${VIZ.ink}">V(F)</text>`;
  s += `<text x="180" y="94" font-size="17" font-weight="800" fill="${VIZ.accent}">1.0 V</text>`;
  s += `<text x="270" y="94" font-size="15" fill="${VIZ.sub}">max</text>`;
  s += `<text x="350" y="94" font-size="17" font-weight="800" fill="#0a7d57">@ I(F) = 10 mA</text>`;
  s += `<text x="590" y="94" font-size="15" fill="${VIZ.sub}">, T = 25 °C</text>`;
  const note=(x,y,txt,c)=>`<line x1="${x}" y1="122" x2="${x}" y2="${y-16}" stroke="${c}" stroke-width="1.3"/><text x="${x}" y="${y}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${c}">${txt}</text>`;
  s += note(110, 152, "무슨 항목인가", VIZ.sub);
  s += note(205, 182, "값", VIZ.accent);
  s += note(288, 152, "최댓값 보증", VIZ.sub);
  s += note(440, 182, "어떤 조건에서인가", "#0a7d57");
  s += note(640, 152, "몇 도에서인가", VIZ.sub);
  s += `<text x="410" y="222" text-anchor="middle" font-size="13" font-weight="800" fill="#b42318">조건을 떼고 "V(F)는 1.0V"라고만 외우면 절반은 틀린 이야기가 됩니다.</text>`;
  s += `<text x="410" y="${h-8}" text-anchor="middle" font-size="12" fill="${VIZ.muted}">같은 다이오드도 1mA에서는 0.7V 남짓, 100mA에서는 1.1V가 넘기도 합니다.</text>`;
  return s+"</svg>";
}

/* ───────── 레이저 포인터 ───────── */
const laserBtn = document.getElementById("laserBtn");
let laserOn = false, laserDot = null, laserCanvas = null, lctx = null, lpts = [], laserRaf = 0;
/* 캔버스가 화면에서 실제로 차지하는 박스(CSS px). 클라이언트 좌표를 캔버스 좌표로 옮길 때 쓴다 */
let lox = 0, loy = 0, lw = 0, lh = 0;

/* ── 잔상 유지 ──
   시간이 지나면 흐려지는 방식이 아니라, 획을 뗀 순간 그대로 고정했다가
   다음 획이 시작될 때 지운다. 티칭 사이트(electronics-teaching-2026)와 같은 동작.
   획의 기준은 '접촉' — 펜슬이 화면에 닿아 있거나 마우스 왼쪽 버튼을 누른 상태. */
const LASER_MAX_PTS = 2000;
let laserFrozen = false;    /* 지금 잔상이 고정되어 있는가 */
let laserDrawing = false;   /* 획을 긋는 중인가 */

/* iOS Safari에서 100vh(주소창 숨김 기준 높이) ≠ innerHeight(현재 보이는 높이) 이므로
   크기를 추정하지 않고 캔버스의 실제 렌더 박스를 재서 버퍼를 맞춘다.
   이렇게 해야 캔버스 1단위 = CSS 1px 이 되어 펜 끝과 잔상이 정확히 겹친다. */
function laserResize(){
  if(!laserCanvas || !lctx) return;
  const d = window.devicePixelRatio || 1;
  const r = laserCanvas.getBoundingClientRect();
  lox = r.left; loy = r.top; lw = r.width; lh = r.height;
  const bw = Math.max(1, Math.round(lw * d)), bh = Math.max(1, Math.round(lh * d));
  if(laserCanvas.width !== bw || laserCanvas.height !== bh){
    laserCanvas.width = bw;
    laserCanvas.height = bh;
  }
  lctx.setTransform(d, 0, 0, d, 0, 0);
}

/* 고정된 잔상은 화면에 붙어 있어서, 내용이 스크롤되면 엉뚱한 곳을 가리키게 된다 → 지운다 */
function laserClearHeld(){
  if(!laserOn || !laserFrozen) return;
  lpts = []; laserFrozen = false;
  if(lctx) lctx.clearRect(0, 0, lw, lh);
}
document.addEventListener("scroll", laserClearHeld, {capture:true, passive:true});

/* 주소창이 나타나고 사라지거나 회전할 때 박스가 바뀌므로 다시 잰다 */
function laserBindResize(on){
  const fn = on ? addEventListener : removeEventListener;
  fn("resize", laserResize);
  fn("orientationchange", laserResize);
  fn("scroll", laserResize, true);
  if(window.visualViewport){
    const vv = window.visualViewport;
    (on ? vv.addEventListener : vv.removeEventListener).call(vv, "resize", laserResize);
    (on ? vv.addEventListener : vv.removeEventListener).call(vv, "scroll", laserResize);
  }
}

function laserTick(){
  if(!laserOn || !lctx) return;
  lctx.clearRect(0, 0, lw, lh);
  const N = lpts.length;
  if(N > 1){
    /* 같은 경로를 여러 겹으로 — 머리쪽일수록 더 많은 패스가 겹쳐 굵고 진해짐 */
    lctx.lineCap = "round"; lctx.lineJoin = "round";
    lctx.strokeStyle = "rgba(255,58,58,0.13)";
    const passes = 6;
    for(let p = 0; p < passes; p++){
      const start = Math.floor((N - 1) * p / passes);
      lctx.lineWidth = 1.5 + p * 1.9;
      lctx.beginPath();
      lctx.moveTo(lpts[start].x, lpts[start].y);
      for(let i = start + 1; i < N; i++) lctx.lineTo(lpts[i].x, lpts[i].y);
      lctx.stroke();
    }
  }
  /* 고정된 뒤에는 다시 그릴 필요가 없으므로 루프를 멈춘다(발열·배터리 이득) */
  if(laserFrozen){ laserRaf = 0; return; }
  laserRaf = requestAnimationFrame(laserTick);
}

/* 획의 시작과 끝 — 유지 모드의 기준점 */
function laserStrokeStart(){
  if(!laserOn) return;
  laserDrawing = true;
  if(laserFrozen){ lpts = []; laserFrozen = false; }
  if(!laserRaf) laserRaf = requestAnimationFrame(laserTick);
}
function laserStrokeEnd(){
  if(!laserOn) return;
  laserDrawing = false;
  /* 지금 모습 그대로 고정한다(다음 프레임이 한 번 더 그린 뒤 멈춘다) */
  laserFrozen = true;
}

function setLaser(on){
  laserOn = on;
  document.body.classList.toggle("laser-on", on);
  laserBtn.classList.toggle("on", on);
  if(on){
    if(!laserDot){
      laserDot = document.createElement("div");
      laserDot.className = "laser-dot";
      laserDot.style.display = "none";
      document.body.appendChild(laserDot);
    }
    if(!laserCanvas){
      laserCanvas = document.createElement("canvas");
      laserCanvas.id = "laserCanvas";
      document.body.appendChild(laserCanvas);
      lctx = laserCanvas.getContext("2d");
      laserResize();
      laserBindResize(true);
    }
    laserRaf = requestAnimationFrame(laserTick);
  }else{
    cancelAnimationFrame(laserRaf);
    laserBindResize(false);
    if(laserDot){ laserDot.remove(); laserDot = null; }
    if(laserCanvas){ laserCanvas.remove(); laserCanvas = null; lctx = null; }
    lpts = [];
    laserFrozen = false; laserDrawing = false;
  }
}
laserBtn.onclick = ()=> setLaser(!laserOn);

/* record=false 면 붉은 점만 옮기고 꼬리에는 기록하지 않는다.
   유지 모드에서 호버(펜슬을 띄운 상태·마우스 이동)가 고정된 잔상을 망치지 않도록 하는 장치. */
function laserMove(x, y, record){
  if(!laserOn || !laserDot) return;
  laserDot.style.display = "block";
  laserDot.style.left = x+"px";
  laserDot.style.top = y+"px";
  if(record === false) return;
  /* 점(fixed 배치)은 클라이언트 좌표 그대로, 잔상은 캔버스 로컬 좌표로 변환해 저장 */
  const cx = x - lox, cy = y - loy;
  /* 펜슬은 touch/pointer 이벤트가 같은 좌표로 중복 발생 → 같은 점은 꼬리에 넣지 않음 */
  const last = lpts[lpts.length - 1];
  if(last && Math.abs(last.x - cx) < 0.5 && Math.abs(last.y - cy) < 0.5) return;
  lpts.push({x: cx, y: cy, t: performance.now()});
  if(lpts.length > LASER_MAX_PTS) lpts.shift();
}

/* 애플 펜슬(스타일러스) = 레이저만 이동(스크롤 차단), 손가락 = 평소대로 스크롤 */
function isStylus(t){ return !!t && t.touchType === "stylus"; }
function onLaserBtn(el){ return !!(el && el.closest && el.closest("#laserBtn")); }

document.addEventListener("mousemove", e=>{
  if(!laserOn) return;
  /* 왼쪽 버튼을 누른 채 움직일 때만 획으로 인정한다. 그냥 움직이면 붉은 점만 따라온다 */
  const contact = (e.buttons & 1) === 1;
  if(contact && !laserDrawing) laserStrokeStart();
  laserMove(e.clientX, e.clientY, contact);
});
document.addEventListener("mousedown", e=>{
  if(!laserOn || e.button !== 0 || onLaserBtn(e.target)) return;
  laserStrokeStart();
  laserMove(e.clientX, e.clientY, true);
});
document.addEventListener("mouseup", e=>{
  if(!laserOn || e.button !== 0) return;
  laserStrokeEnd();
});

/* 펜슬 호버(지원 기기)에서도 포인터가 따라오도록 */
document.addEventListener("pointermove", e=>{
  if(!laserOn || e.pointerType !== "pen") return;
  /* 펜슬이 화면에 닿아 있을 때(pressure>0)만 꼬리에 기록한다. 띄운 상태에서는 점만 이동 */
  laserMove(e.clientX, e.clientY, e.pressure > 0);
});

/* passive:false 여야 preventDefault()로 스크롤을 막을 수 있다 */
document.addEventListener("touchstart", e=>{
  if(!laserOn) return;
  const t = e.touches[0];
  if(!isStylus(t) || onLaserBtn(e.target)) return;   /* 손가락·레이저 버튼은 그대로 */
  e.preventDefault();                                /* 스크롤 시작 자체를 차단 */
  laserResize();                                     /* 획 시작 시점에 박스를 다시 측정 */
  laserStrokeStart();
  laserMove(t.clientX, t.clientY);
}, {passive:false});

/* 펜슬을 떼면 획이 끝난 것으로 본다 (touchend에는 touches가 비어 changedTouches를 본다) */
["touchend","touchcancel"].forEach(function(ev){
  document.addEventListener(ev, function(e){
    if(!laserOn) return;
    if(!isStylus(e.changedTouches && e.changedTouches[0])) return;
    laserStrokeEnd();
  }, {passive:true});
});

document.addEventListener("touchmove", e=>{
  if(!laserOn) return;
  const t = e.touches[0];
  if(!isStylus(t)) return;                           /* 손가락 스크롤은 유지 */
  e.preventDefault();
  laserMove(t.clientX, t.clientY);
}, {passive:false});
document.addEventListener("keydown", e=>{
  const tag = (document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA") return;
  if(e.key==="l"||e.key==="L") setLaser(!laserOn);
  if(e.key==="Escape" && laserOn) setLaser(false);
});

function ytId(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,20})/);
  return m ? m[1] : null;
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

render();
</script>
</body>
</html>
