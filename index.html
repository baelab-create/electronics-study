<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26년 배원규 교수 전자공학 학습자료실</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --sidebar:#101828; --sidebar-2:#1b2537;
    --ink:#1f2733; --muted:#66707f; --line:#e6e9f0;
    --accent:#2f6bff; --accent-soft:#eaf0ff; --accent-ink:#1c49c2;
    --green:#0f9d6e; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); display:flex; overflow:hidden;
  }

  /* ───────── 왼쪽 네비게이션 ───────── */
  #sidebar{
    width:280px; min-width:280px; height:100vh; overflow-y:auto;
    background:var(--sidebar); color:#e8ecf4; display:flex; flex-direction:column;
  }
  .brand{padding:26px 22px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
  .brand h1{font-size:19px; font-weight:800; letter-spacing:-.3px;}
  .brand p{font-size:12px; color:#93a0b4; margin-top:6px; line-height:1.5;}
  .nav-label{
    font-size:11px; font-weight:700; letter-spacing:.12em; color:#7d8aa0;
    padding:20px 22px 8px; text-transform:uppercase;
  }
  .nav-item{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:11px 18px; margin:2px 8px; width:calc(100% - 16px);
    border:0; background:transparent; color:#cfd7e4; text-align:left;
    font-size:14px; border-radius:10px; cursor:pointer; font-family:inherit;
    transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.07);}
  .nav-item.active{background:var(--accent); color:#fff; font-weight:700;}
  .chip{
    min-width:34px; height:24px; border-radius:7px; background:rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; letter-spacing:.02em;
  }
  .nav-item.active .chip{background:rgba(255,255,255,.25);}
  .nav-item .t{flex:1; line-height:1.3; min-width:0;}
  .nav-item .t small{display:block; font-size:11px; color:#8b97ab; font-weight:400; margin-top:2px;}
  /* 자료 페이지는 제목이 길어 잘 접힌다 — 글자를 줄이고 어절 단위로만 줄바꿈 */
  #customNav .nav-item{padding:10px 14px; gap:10px;}
  #customNav .nav-item .t{font-size:12.5px; word-break:keep-all;}
  #customNav .nav-item .t small{font-size:10px; margin-top:3px; word-break:keep-all;}
  #customNav .nav-item .chip{min-width:30px; height:22px; font-size:12px;}
  .nav-item.active .t small{color:#dbe4ff;}
  .nav-item .del{
    opacity:0; border:0; background:transparent; color:inherit; cursor:pointer;
    font-size:14px; padding:2px 6px; border-radius:6px;
  }
  .nav-item:hover .del{opacity:.7;} .nav-item .del:hover{opacity:1; background:rgba(255,255,255,.15);}
  #addPageBtn{
    margin:10px 16px 24px; padding:12px; border-radius:10px; cursor:pointer;
    border:1.5px dashed rgba(255,255,255,.3); background:transparent; color:#aeb9cc;
    font-size:13.5px; font-weight:600; font-family:inherit; transition:.15s;
  }
  #addPageBtn:hover{border-color:var(--accent); color:#fff; background:rgba(47,107,255,.15);}
  .sidebar-foot{margin-top:auto; padding:16px 22px; font-size:11px; color:#5d6b81; border-top:1px solid rgba(255,255,255,.06);}

  /* ───────── 본문 ───────── */
  #main{flex:1; height:100vh; overflow-y:auto; padding:36px 44px;}
  .view{max-width:900px; margin:0 auto;}

  .ch-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .ch-eyebrow{
    display:inline-block; background:var(--accent-soft); color:var(--accent-ink);
    font-size:12px; font-weight:800; letter-spacing:.08em; padding:5px 12px; border-radius:999px;
  }
  .ch-title{font-size:30px; font-weight:800; letter-spacing:-.5px; margin-top:12px;}
  .ch-sub{color:var(--muted); font-size:15px; margin-top:6px;}
  .meta{color:var(--muted); font-size:13px; margin-top:10px;}

  .dl-btn{
    display:inline-flex; align-items:center; gap:9px; margin-top:14px;
    background:var(--accent); color:#fff; text-decoration:none;
    padding:13px 22px; border-radius:11px; font-size:15px; font-weight:700;
    box-shadow:0 6px 16px rgba(47,107,255,.28); transition:.15s;
  }
  .dl-btn:hover{transform:translateY(-1px); box-shadow:0 9px 20px rgba(47,107,255,.35);}
  .dl-btn svg{width:18px; height:18px;}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px 26px; margin-top:22px;
  }
  .card h3{font-size:15px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .obj-list{list-style:none;}
  .obj-list li{
    position:relative; padding:7px 0 7px 26px; font-size:14.5px; line-height:1.6; color:#39424f;
  }
  .obj-list li::before{content:"✓"; position:absolute; left:2px; color:var(--green); font-weight:800;}

  .pdf-frame{width:100%; height:640px; border:1px solid var(--line); border-radius:12px; margin-top:22px; background:#fff;}

  /* ───────── 커스텀 페이지(추가하기) ───────── */
  .page-title-input{
    width:100%; border:0; background:transparent; font-family:inherit;
    font-size:30px; font-weight:800; letter-spacing:-.5px; color:var(--ink); outline:none;
  }
  .page-title-input::placeholder{color:#c1c8d4;}
  .hint{color:var(--muted); font-size:13px; margin-top:8px;}
  .add-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .add-row input{
    flex:1; min-width:200px; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; font-family:inherit; outline:none; background:#fbfcfe;
  }
  .add-row input:focus{border-color:var(--accent);}
  .btn{
    padding:11px 18px; border-radius:10px; border:0; cursor:pointer; font-family:inherit;
    font-size:14px; font-weight:700; background:var(--accent); color:#fff;
  }
  .btn.ghost{background:var(--accent-soft); color:var(--accent-ink);}
  .btn.danger{background:#fdecec; color:#c0392b;}
  .yt-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px;}
  .yt-item iframe{width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:#000;}
  .yt-item .yt-cap{display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:13px; color:var(--muted);}
  .link-list{list-style:none;}
  .link-list li{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .link-list li:last-child{border-bottom:0;}
  .link-list a{color:var(--accent-ink); text-decoration:none; font-weight:600; word-break:break-all;}
  .link-list a:hover{text-decoration:underline;}
  .mini-del{border:0; background:transparent; color:#aab2bf; cursor:pointer; font-size:15px; margin-left:auto; padding:2px 8px; border-radius:6px;}
  .mini-del:hover{background:#fdecec; color:#c0392b;}
  textarea.memo{
    width:100%; min-height:140px; border:1px solid var(--line); border-radius:10px;
    padding:14px; font-family:inherit; font-size:14.5px; line-height:1.7; outline:none; resize:vertical; background:#fbfcfe;
  }
  textarea.memo:focus{border-color:var(--accent);}
  .empty{color:#aab2bf; font-size:13.5px; padding:8px 2px;}
  .page-actions{margin-top:26px; display:flex; gap:10px;}

  /* ───────── 공지사항 ───────── */
  .notice-badge{
    min-width:20px; height:20px; padding:0 6px; border-radius:999px;
    background:#ff5d5d; color:#fff; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-left:auto;
  }
  .notice-form input{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:14.5px; font-weight:700; font-family:inherit; outline:none; background:#fbfcfe; margin-bottom:10px;
  }
  .notice-form input:focus, .notice-form textarea:focus{border-color:var(--accent);}
  .notice-form textarea{
    width:100%; min-height:96px; border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-family:inherit; font-size:14.5px; line-height:1.7; outline:none; resize:vertical; background:#fbfcfe;
  }
  .notice-form .form-foot{display:flex; justify-content:flex-end; margin-top:10px;}
  .notice-item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 24px; margin-top:14px;
  }
  .notice-item.pinned{border-left:4px solid var(--accent);}
  .notice-head{display:flex; align-items:baseline; gap:10px;}
  .notice-head h4{font-size:16.5px; font-weight:800; flex:1; line-height:1.4;}
  .notice-date{font-size:12.5px; color:var(--muted); white-space:nowrap;}
  .notice-body{margin-top:10px; font-size:14.5px; line-height:1.75; color:#39424f; white-space:pre-wrap;}

  /* ───────── 고정 자료 페이지 (반도체 발전사) ───────── */
  .era-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin-top:18px;}
  .era-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
  .era-year{display:inline-block; background:var(--accent-soft); color:var(--accent-ink); font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px;}
  .era-card h4{font-size:15.5px; font-weight:800; margin-top:10px;}
  .era-card p{font-size:13.5px; line-height:1.65; color:#4a5462; margin-top:6px;}
  .era-card.hl{border:1.5px solid var(--accent); box-shadow:0 4px 14px rgba(47,107,255,.12);}
  .chart-wrap{margin-top:16px;}
  .chart-wrap svg{width:100%; height:auto; display:block;}
  .chart-note{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.6;}
  .callout{
    background:#fff8e8; border:1px solid #f2dfae; border-radius:var(--radius);
    padding:20px 24px; margin-top:22px;
  }
  .callout h3{font-size:15px; font-weight:800; margin-bottom:10px;}
  .callout p{font-size:14px; line-height:1.75; color:#4a4636;}
  .mat-table-wrap{overflow-x:auto; margin-top:14px;}
  .mat-table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px;}
  .mat-table th{
    text-align:left; padding:10px 12px; background:#f2f5fb;
    color:#435063; font-weight:800; border-bottom:2px solid var(--line); white-space:nowrap;
  }
  .mat-table td{padding:10px 12px; border-bottom:1px solid var(--line); line-height:1.55; vertical-align:top;}
  .mat-table td:first-child{font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .mat-table tr.hl-row td{background:#eef3ff;}
  .mat-section-note{font-size:13px; color:var(--muted); margin-top:14px; line-height:1.7;}

  /* ───────── 고정 자료 페이지 (전기는 흐르지 않는다) ───────── */
  .fact-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px;}
  .fact-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px 20px;}
  .fact-card.myth{background:#fff6f5; border-color:#f2d6d2;}
  .fact-card.truth{background:#f1f6ff; border-color:#cfdefa;}
  .fact-tag{display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.06em; padding:4px 10px; border-radius:999px;}
  .fact-card.myth .fact-tag{background:#fadedb; color:#a3423c;}
  .fact-card.truth .fact-tag{background:#dbe7ff; color:#25519e;}
  .fact-card p{font-size:13.8px; line-height:1.72; color:#3f4855; margin-top:9px;}
  .calc{
    background:#f7f9fc; border:1px solid var(--line); border-radius:12px;
    padding:16px 20px; margin-top:16px; font-size:14px; line-height:1.85; color:#3f4855;
  }
  .calc .eq{display:block; font-size:16px; font-weight:800; color:var(--ink); margin-bottom:8px; letter-spacing:.01em;}
  .calc .num{font-variant-numeric:tabular-nums; font-weight:700; color:var(--accent-ink);}
  .calc-note{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.6;}
  .link-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-top:16px;}
  .link-card{
    display:block; border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    background:var(--panel); text-decoration:none; color:inherit; transition:.15s;
  }
  .link-card:hover{border-color:var(--accent); box-shadow:0 4px 14px rgba(47,107,255,.12);}
  .link-card b{display:block; font-size:14px; font-weight:800;}
  .link-card span{display:block; font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.55;}
  @media (max-width:820px){ .fact-grid{grid-template-columns:1fr;} }

  /* ───────── 고정 자료 페이지 (원자모델) ───────── */
  .atom-list{list-style:none; margin-top:18px; counter-reset:am;}
  .atom-list li{
    counter-increment:am; position:relative; padding:12px 0 12px 44px;
    border-bottom:1px solid var(--line); font-size:14.5px; line-height:1.72; color:#39424f;
  }
  .atom-list li:last-child{border-bottom:0;}
  .atom-list li::before{
    content:counter(am); position:absolute; left:0; top:13px;
    width:25px; height:25px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent-ink); font-size:12.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .am-tag{
    display:inline-block; background:#eef2f7; color:#4a5462; font-size:11.5px; font-weight:800;
    padding:3px 9px; border-radius:999px; margin-right:8px; vertical-align:1px;
  }
  .am-key{color:var(--accent-ink); font-weight:800;}
  .sub-h{
    font-size:15.5px; font-weight:800; color:var(--ink);
    margin-top:26px; padding-top:22px; border-top:1px solid var(--line);
  }
  .quote{
    border-left:4px solid var(--accent); background:#f5f9ff; border-radius:0 12px 12px 0;
    padding:18px 22px; margin-top:20px; font-size:14.5px; line-height:1.9; color:#39424f;
  }
  .quote b{color:var(--accent-ink);}

  /* ───────── 반도체 회사 구도 ───────── */
  .biz-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:18px;}
  .biz-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; background:var(--panel);}
  .biz-card.hl{border:1.5px solid var(--accent); box-shadow:0 4px 14px rgba(47,107,255,.12);}
  .biz-tag{display:inline-block; background:var(--accent-soft); color:var(--accent-ink);
           font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:999px;}
  .biz-card h4{font-size:15px; font-weight:800; margin-top:10px;}
  .biz-card p{font-size:13.5px; line-height:1.68; color:#4a5462; margin-top:7px;}
  .biz-card .co{font-size:12.5px; color:var(--accent-ink); font-weight:700; margin-top:9px; line-height:1.6;}

  /* ───────── 챕터 배지 · 역사 콜아웃 ───────── */
  .ch-badge{
    display:inline-block; background:#e8edf5; color:#4a5462;
    font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; margin-left:7px;
    vertical-align:2px; letter-spacing:.01em;
  }
  .nav-item .ch-pill{
    display:inline-block; background:rgba(255,255,255,.14); color:#c7d2e3;
    font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:999px;
    margin-right:5px; vertical-align:1px; font-style:normal;
  }
  .nav-item.active .ch-pill{background:rgba(255,255,255,.26); color:#fff;}
  .hist{
    background:#fbf7ef; border:1px solid #e6dcc6; border-left:4px solid #b08b3f;
    border-radius:0 var(--radius) var(--radius) 0; padding:20px 24px; margin-top:22px;
  }
  .hist h4{font-size:15px; font-weight:800; color:#6b5220; margin-bottom:10px;}
  .hist p{font-size:14px; line-height:1.8; color:#5b5340; margin-top:10px;}
  .hist p:first-of-type{margin-top:0;}
  .hist b{color:#6b5220;}

  /* ───────── 아코디언 ───────── */
  .acc-bar{display:flex; gap:8px; margin-top:20px;}
  .acc-btn{
    border:1px solid var(--line); background:var(--panel); color:#4a5462;
    font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 14px;
    border-radius:999px; cursor:pointer; transition:.15s;
  }
  .acc-btn:hover{border-color:var(--accent); color:var(--accent-ink);}
  details.acc > summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px;
    font-size:15px; font-weight:800; color:var(--ink); user-select:none;
  }
  details.acc > summary::-webkit-details-marker{display:none;}
  details.acc > summary::after{
    content:"⌃"; margin-left:auto; color:var(--muted); font-size:15px;
    display:inline-block; transform:rotate(180deg); transition:transform .15s;
  }
  details.acc:not([open]) > summary::after{transform:rotate(90deg);}
  details.acc[open] > summary{margin-bottom:14px;}
  details.acc > summary:hover{color:var(--accent-ink);}

  /* ───────── 확인 문제 ───────── */
  .quiz-item{padding:14px 0; border-bottom:1px solid var(--line);}
  .quiz-item:last-child{border-bottom:0; padding-bottom:0;}
  .quiz-q{display:flex; gap:11px; font-size:14.5px; line-height:1.72; color:#39424f;}
  .quiz-no{
    flex:none; width:25px; height:25px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent-ink); font-size:12.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .qa{margin:10px 0 0 36px;}
  .qa > summary{
    list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:800; color:var(--accent-ink); background:var(--accent-soft);
    padding:6px 13px; border-radius:999px; user-select:none;
  }
  .qa > summary::-webkit-details-marker{display:none;}
  .qa[open] > summary{margin-bottom:10px;}
  .qa .a{
    font-size:14px; line-height:1.78; color:#39424f;
    background:#f7f9fc; border:1px solid var(--line); border-radius:10px; padding:14px 17px;
  }
  .qa .a b{color:var(--accent-ink);}
  .qa .pts{margin-top:11px; padding-top:11px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted);}
  .qa .pts b{color:#4a5462;}
  .qa .pts ul{margin:6px 0 0 18px; line-height:1.75;}
  .quiz-lead{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.7;}

  /* ───────── 레이저 포인터 ───────── */
  #laserBtn{
    position:fixed; right:22px; bottom:22px; z-index:1000;
    display:flex; align-items:center; gap:8px;
    padding:11px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-family:inherit;
    font-size:13.5px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 14px rgba(16,24,40,.14); transition:.15s;
  }
  #laserBtn:hover{transform:translateY(-1px);}
  #laserBtn .dot{width:10px; height:10px; border-radius:50%; background:#e34948;}
  #laserBtn.on{background:#e34948; border-color:#e34948; color:#fff;}
  #laserBtn.on .dot{background:#fff; box-shadow:0 0 8px 2px rgba(255,255,255,.8);}
  body.laser-on, body.laser-on *{cursor:none !important;}
  body.laser-on{user-select:none; -webkit-user-select:none;}
  body.laser-on #laserBtn, body.laser-on #laserBtn *{cursor:pointer !important;}
  .laser-dot{
    position:fixed; left:0; top:0; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle, #ffd9d9 0%, #ff4b4b 40%, #d40000 100%);
    box-shadow:0 0 14px 5px rgba(255,45,45,.55);
    pointer-events:none; z-index:2000; transform:translate(-50%,-50%);
  }
  #laserCanvas{position:fixed; left:0; top:0; width:100%; height:100vh; pointer-events:none; z-index:1999;}
  @supports (height:100dvh){ #laserCanvas{height:100dvh;} }

  @media (max-width:820px){
    body{flex-direction:column; overflow:auto;}
    #sidebar{width:100%; min-width:0; height:auto; max-height:45vh;}
    #main{height:auto; padding:24px 18px;}
  }
</style>
</head>
<body>

<nav id="sidebar">
  <div class="brand">

function bindCustom(p){
  const upd = ()=>{ savePages(customPages); renderNav(); };
  document.getElementById("pgTitle").oninput = e=>{ p.title = e.target.value; upd(); };
  document.getElementById("pgMemo").oninput = e=>{ p.memo = e.target.value; savePages(customPages); };
  document.getElementById("pgDelete").onclick = ()=> deletePage(p.id);

  document.getElementById("ytAdd").onclick = ()=>{
    const url = document.getElementById("ytUrl").value.trim();
    const id = ytId(url);
    if(!id){ alert("유효한 유튜브 링크가 아닙니다."); return; }
    p.videos.push({url, id}); savePages(customPages); render();
  };
  document.getElementById("rdAdd").onclick = ()=>{
    const t = document.getElementById("rdTitle").value.trim();
    const u = document.getElementById("rdUrl").value.trim();
    if(!u){ alert("링크를 입력하세요."); return; }
    p.readings.push({title:t, url:u.startsWith("http")?u:"https://"+u}); savePages(customPages); render();
  };
  document.querySelectorAll("[data-del-yt]").forEach(b=> b.onclick = ()=>{ p.videos.splice(+b.dataset.delYt,1); savePages(customPages); render(); });
  document.querySelectorAll("[data-del-rd]").forEach(b=> b.onclick = ()=>{ p.readings.splice(+b.dataset.delRd,1); savePages(customPages); render(); });
}

/* ───────── 고정 자료: 반도체 발전사 ───────── */
const VIZ = {ink:"#0b0b0b", sub:"#52514e", muted:"#898781", grid:"#e6e9f0", axis:"#c3c2b7", blue:"#2a78d6", accent:"#2f6bff"};

function logLineChart(cfg){
  const w=820, h=cfg.h||380, p={t:24,r:30,b:40,l:70};
  const iw=w-p.l-p.r, ih=h-p.t-p.b;
  const x = yr => p.l + (yr-cfg.x0)/(cfg.x1-cfg.x0)*iw;
  const y = v  => p.t + (Math.log10(cfg.y1)-Math.log10(v))/(Math.log10(cfg.y1)-Math.log10(cfg.y0))*ih;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${cfg.aria}">`;
  cfg.yTicks.forEach(t=>{
    s += `<line x1="${p.l}" y1="${y(t.v)}" x2="${w-p.r}" y2="${y(t.v)}" stroke="${VIZ.grid}" stroke-width="1"/>`;
    s += `<text x="${p.l-10}" y="${y(t.v)+4}" text-anchor="end" font-size="12" fill="${VIZ.muted}">${t.t}</text>`;
  });
  cfg.xTicks.forEach(t=>{
    s += `<text x="${x(t)}" y="${h-p.b+24}" text-anchor="middle" font-size="12" fill="${VIZ.muted}" font-variant-numeric="tabular-nums">${t}</text>`;
    s += `<line x1="${x(t)}" y1="${h-p.b}" x2="${x(t)}" y2="${h-p.b+6}" stroke="${VIZ.axis}" stroke-width="1"/>`;
  });
  s += `<line x1="${p.l}" y1="${h-p.b}" x2="${w-p.r}" y2="${h-p.b}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<path d="${cfg.pts.map((d,i)=>(i?"L":"M")+x(d.x).toFixed(1)+" "+y(d.y).toFixed(1)).join(" ")}" fill="none" stroke="${VIZ.blue}" stroke-width="2" stroke-linejoin="round"/>`;
  cfg.pts.forEach(d=>{
    const hl = d.hl;
    s += `<circle cx="${x(d.x).toFixed(1)}" cy="${y(d.y).toFixed(1)}" r="${hl?6:4}" fill="${hl?VIZ.accent:VIZ.blue}" stroke="#fff" stroke-width="2"><title>${d.x}년 · ${d.tip}</title></circle>`;
    if(d.lbl){
      const above = d.lpos!=="b";
      s += `<text x="${x(d.x).toFixed(1)}" y="${(y(d.y)+(above?-12:22)).toFixed(1)}" text-anchor="middle" font-size="${hl?13:11.5}" font-weight="${hl?800:600}" fill="${hl?VIZ.accent:VIZ.sub}">${d.lbl}</text>`;
    }
  });
  return s+"</svg>";
}

function scaleLadder(){
  const w=820, h=230, p={l:40,r:40}, axY=130;
  const x0=Math.log10(0.1), x1=Math.log10(200000);
  const x = v => p.l + (Math.log10(v)-x0)/(x1-x0)*(w-p.l-p.r);
  const ticks=[[0.1,"0.1nm"],[1,"1nm"],[10,"10nm"],[100,"100nm"],[1000,"1µm"],[10000,"10µm"],[100000,"0.1mm"]];
  const items=[
    {v:0.2, t:"실리콘 원자", d:"약 0.2nm", up:true},
    {v:2, t:"2nm 공정 노드", d:"최신 반도체", up:false, hl:true},
    {v:2.5, t:"DNA 폭", d:"약 2.5nm", up:true},
    {v:100, t:"바이러스", d:"약 100nm", up:false},
    {v:1000, t:"박테리아", d:"약 1µm", up:true},
    {v:7000, t:"적혈구", d:"약 7µm", up:false},
    {v:80000, t:"머리카락 굵기", d:"약 80µm", up:true},
  ];
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2나노미터 크기 비교">`;
  s += `<line x1="${p.l}" y1="${axY}" x2="${w-p.r}" y2="${axY}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  ticks.forEach(([v,t])=>{
    s += `<line x1="${x(v)}" y1="${axY-4}" x2="${x(v)}" y2="${axY+4}" stroke="${VIZ.axis}" stroke-width="1"/>`;
    s += `<text x="${x(v)}" y="${axY+40}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">${t}</text>`;
  });
  items.forEach(it=>{
    const cx=x(it.v), c=it.hl?VIZ.accent:VIZ.blue;
    const ly = it.up ? axY-52 : axY+62;
    s += `<line x1="${cx}" y1="${axY}" x2="${cx}" y2="${it.up?axY-34:axY+52}" stroke="${c}" stroke-width="1" stroke-dasharray="2 3"/>`;
    s += `<circle cx="${cx}" cy="${axY}" r="${it.hl?7:5}" fill="${c}" stroke="#fff" stroke-width="2"><title>${it.t} · ${it.d}</title></circle>`;
    s += `<text x="${cx}" y="${it.up?ly-14:ly}" text-anchor="middle" font-size="${it.hl?13:12}" font-weight="${it.hl?800:700}" fill="${it.hl?VIZ.accent:VIZ.ink}">${it.t}</text>`;
    s += `<text x="${cx}" y="${it.up?ly:ly+15}" text-anchor="middle" font-size="11" fill="${VIZ.sub}">${it.d}</text>`;
  });
  return s+"</svg>";
}

/* 원자모형의 변천 — 돌턴부터 전자구름모형까지 */
function atomModelChart(){
  const w=820, h=260, cy=160, r=58;
  const cx=[110,260,410,560,710];
  const names=["돌턴","톰슨","러더퍼드","보어","현재모형"];
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원자모형의 변천: 돌턴, 톰슨, 러더퍼드, 보어, 현재의 전자구름모형">`;
  s += `<defs>`;
  s += `<radialGradient id="amGray" cx="35%" cy="28%" r="75%"><stop offset="0" stop-color="#f4f4f4"/><stop offset="0.55" stop-color="#c4c4c4"/><stop offset="1" stop-color="#8d8d8d"/></radialGradient>`;
  s += `<radialGradient id="amBlue" cx="35%" cy="28%" r="75%"><stop offset="0" stop-color="#86d6f8"/><stop offset="0.5" stop-color="#2ba4e1"/><stop offset="1" stop-color="#0f6ba9"/></radialGradient>`;
  s += `<radialGradient id="amNuc" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffd28a"/><stop offset="0.6" stop-color="#f79a1e"/><stop offset="1" stop-color="#d97706"/></radialGradient>`;
  s += `<radialGradient id="amCloud" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1f7fc4" stop-opacity=".92"/><stop offset="0.42" stop-color="#2f9ad8" stop-opacity=".45"/><stop offset="0.75" stop-color="#7fc9ef" stop-opacity=".16"/><stop offset="1" stop-color="#7fc9ef" stop-opacity="0"/></radialGradient>`;
  s += `<filter id="amBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>`;
  s += `</defs>`;
  s += `<rect x="0" y="0" width="${w}" height="${h}" rx="16" fill="#f4f5f7"/>`;

  /* 상단 라벨과 진행 화살표 */
  names.forEach((n,i)=>{
    s += `<text x="${cx[i]}" y="40" text-anchor="middle" font-size="17" font-weight="800" fill="${VIZ.ink}">${n}</text>`;
    if(i<4){
      const ax=(cx[i]+cx[i+1])/2;
      s += `<path d="M${ax-14} 28 L${ax} 28 L${ax} 22 L${ax+14} 34 L${ax} 46 L${ax} 40 L${ax-14} 40 Z" fill="#f9b619"/>`;
    }
  });

  const gloss = c => `<ellipse cx="${c-19}" cy="${cy-25}" rx="19" ry="12" fill="#fff" opacity=".22"/>`;
  const elec = (x,y,rr) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr}" fill="#e8552d" stroke="#fff" stroke-width="1.2"/>`;

  /* ① 돌턴 — 단단한 공 */
  s += `<circle cx="${cx[0]}" cy="${cy}" r="${r}" fill="url(#amGray)"/>` + gloss(cx[0]);

  /* ② 톰슨 — 푸딩 모형 */
  s += `<circle cx="${cx[1]}" cy="${cy}" r="${r}" fill="url(#amBlue)"/>` + gloss(cx[1]);
  [[-30,-22],[6,-34],[32,-12],[-38,6],[-8,-2],[20,14],[-22,32],[10,36],[38,26]].forEach(([dx,dy])=>{
    s += elec(cx[1]+dx, cy+dy, 6);
  });

  /* ③ 러더퍼드 — 전자가 핵 주위를 도는 행성모형 */
  s += `<circle cx="${cx[2]}" cy="${cy}" r="${r}" fill="url(#amBlue)"/>` + gloss(cx[2]);
  [0,60,120].forEach(a=>{
    s += `<ellipse cx="${cx[2]}" cy="${cy}" rx="50" ry="19" fill="none" stroke="#eaf6ff" stroke-width="1.6" opacity=".85" transform="rotate(${a} ${cx[2]} ${cy})"/>`;
  });
  [[0,50,0],[60,-50,0],[120,50,0],[0,-50,0],[60,50,0],[120,-50,0]].forEach(([a,ox,oy],i)=>{
    const t=a*Math.PI/180;
    s += elec(cx[2]+ox*Math.cos(t)-oy*Math.sin(t), cy+ox*Math.sin(t)+oy*Math.cos(t), 5.5);
  });
  s += `<circle cx="${cx[2]}" cy="${cy}" r="16" fill="url(#amNuc)"/>`;
  s += `<text x="${cx[2]}" y="${cy+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">＋</text>`;

  /* ④ 보어 — 불연속적인 원궤도 */
  s += `<circle cx="${cx[3]}" cy="${cy}" r="${r}" fill="url(#amBlue)"/>` + gloss(cx[3]);
  [26,40,52].forEach(rr=>{
    s += `<circle cx="${cx[3]}" cy="${cy}" r="${rr}" fill="none" stroke="#eaf6ff" stroke-width="1.6" opacity=".85"/>`;
  });
  [[26,-55],[26,125],[40,20],[40,200],[52,-100],[52,70],[52,165]].forEach(([rr,a])=>{
    const t=a*Math.PI/180;
    s += elec(cx[3]+rr*Math.cos(t), cy+rr*Math.sin(t), 5.5);
  });
  s += `<circle cx="${cx[3]}" cy="${cy}" r="18" fill="url(#amNuc)"/>`;
  s += `<text x="${cx[3]}" y="${cy+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">＋</text>`;

  /* ⑤ 현재모형 — 전자구름 */
  s += `<circle cx="${cx[4]}" cy="${cy}" r="${r+4}" fill="url(#amCloud)" filter="url(#amBlur)"/>`;
  s += `<circle cx="${cx[4]}" cy="${cy}" r="7" fill="#f79a1e" opacity=".9"/>`;
  s += elec(cx[4]+30, cy-14, 6);
  return s+"</svg>";
}

/* ── 러더퍼드 금박 산란 실험 ── */
function rutherfordExp(){
  const w=820, h=310, fx=380, fy=160, R=150;
  const pol = (a,r)=>[fx+r*Math.cos(a*Math.PI/180), fy+r*Math.sin(a*Math.PI/180)];
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="러더퍼드 금박 산란 실험 개념도">`;
  s += `<defs><marker id="raA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${VIZ.blue}"/></marker>`;
  s += `<marker id="raB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8552d"/></marker></defs>`;

  /* 형광 스크린(검출기) */
  s += `<path d="M${pol(-62,R)[0].toFixed(1)} ${pol(-62,R)[1].toFixed(1)} A${R} ${R} 0 0 1 ${pol(62,R)[0].toFixed(1)} ${pol(62,R)[1].toFixed(1)}" fill="none" stroke="${VIZ.axis}" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  s += `<path d="M${pol(118,R)[0].toFixed(1)} ${pol(118,R)[1].toFixed(1)} A${R} ${R} 0 0 1 ${pol(242,R)[0].toFixed(1)} ${pol(242,R)[1].toFixed(1)}" fill="none" stroke="${VIZ.axis}" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  s += `<text x="${(fx+R+14)}" y="${fy+4}" font-size="12" font-weight="700" fill="${VIZ.sub}">형광 스크린</text>`;

  /* 선원 + 시준 */
  s += `<rect x="46" y="${fy-26}" width="52" height="52" rx="7" fill="#4a5462"/>`;
  s += `<circle cx="72" cy="${fy}" r="9" fill="#8ee06a"/>`;
  s += `<text x="72" y="${fy+46}" text-anchor="middle" font-size="12" font-weight="700" fill="${VIZ.sub}">α 선원</text>`;
  s += `<text x="72" y="${fy+62}" text-anchor="middle" font-size="11" fill="${VIZ.muted}">(라듐)</text>`;
  s += `<rect x="150" y="${fy-34}" width="14" height="26" fill="#4a5462"/><rect x="150" y="${fy+8}" width="14" height="26" fill="#4a5462"/>`;
  s += `<line x1="98" y1="${fy}" x2="${fx-14}" y2="${fy}" stroke="${VIZ.blue}" stroke-width="2.5"/>`;

  /* 금박 */
  s += `<rect x="${fx-5}" y="${fy-96}" width="10" height="192" rx="3" fill="#f2b53c" stroke="#c98a13" stroke-width="1.5"/>`;
  s += `<text x="${fx}" y="${fy-106}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#a06f0b">금박</text>`;
  s += `<text x="${fx}" y="${fy+118}" text-anchor="middle" font-size="11" fill="${VIZ.muted}">두께 약 0.0004 mm (금 원자 약 1,000층)</text>`;

  /* 산란 경로 */
  [0,0,0].forEach((_,i)=>{
    const y = fy + (i-1)*16;
    s += `<line x1="${fx+5}" y1="${y}" x2="${fx+R-6}" y2="${y}" stroke="${VIZ.blue}" stroke-width="${i===1?3:1.6}" marker-end="url(#raA)" opacity="${i===1?1:.55}"/>`;
  });
  [18,-22,38].forEach(a=>{
    const [ex,ey]=pol(a,R-6);
    s += `<line x1="${fx+5}" y1="${fy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${VIZ.blue}" stroke-width="1.6" opacity=".7" marker-end="url(#raA)"/>`;
  });
  [162,196].forEach(a=>{
    const [ex,ey]=pol(a,R-6);
    s += `<line x1="${fx-5}" y1="${fy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#e8552d" stroke-width="2.4" marker-end="url(#raB)"/>`;
  });

  s += `<text x="${fx+40}" y="${fy-62}" font-size="12.5" font-weight="800" fill="${VIZ.blue}">대부분 그대로 통과</text>`;
  s += `<text x="${fx+40}" y="${fy-44}" font-size="11.5" fill="${VIZ.sub}">→ 원자 내부는 거의 비어 있다</text>`;
  s += `<text x="${fx-24}" y="${fy-62}" text-anchor="end" font-size="12.5" font-weight="800" fill="#e8552d">8,000개 중 1개꼴로</text>`;
  s += `<text x="${fx-24}" y="${fy-44}" text-anchor="end" font-size="12.5" font-weight="800" fill="#e8552d">90° 넘게 튕겨 나옴</text>`;
  s += `<text x="${fx-24}" y="${fy-26}" text-anchor="end" font-size="11.5" fill="${VIZ.sub}">→ 질량과 (+)전하가 한 점에</text>`;
  return s+"</svg>";
}

/* ── 수소 에너지 준위와 발머 계열 선 스펙트럼 ── */
function hydrogenLevels(){
  const w=820, h=390, yTop=70, yBot=340;
  const E = n => -13.6/(n*n);
  const y = e => yTop + (0-e)/13.6*(yBot-yTop);
  const arrow = (x,y1,y2,c,lw)=>`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2-7}" stroke="${c}" stroke-width="${lw||2.2}"/>`+
    `<path d="M${x-5} ${y2-8} L${x+5} ${y2-8} L${x} ${y2} Z" fill="${c}"/>`;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="수소 원자의 에너지 준위와 발머 계열 선 스펙트럼">`;

  /* 왼쪽: 에너지 준위 */
  s += `<text x="60" y="34" font-size="13.5" font-weight="800" fill="${VIZ.ink}">수소 원자의 에너지 준위</text>`;
  s += `<text x="60" y="52" font-size="11.5" fill="${VIZ.muted}">Eₙ = −13.6 / n² [eV]</text>`;
  s += `<line x1="60" y1="${yTop-6}" x2="60" y2="${yBot+10}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  [1,2,3,4,5,6].forEach(n=>{
    const yy=y(E(n));
    s += `<line x1="72" y1="${yy.toFixed(1)}" x2="300" y2="${yy.toFixed(1)}" stroke="${VIZ.ink}" stroke-width="${n<=3?2.2:1.4}"/>`;
    if(n<=3) s += `<text x="308" y="${(yy+4).toFixed(1)}" font-size="12" font-weight="700" fill="${VIZ.sub}">n=${n}　${E(n).toFixed(2)} eV</text>`;

  s += `<line x1="72" y1="${yTop}" x2="300" y2="${yTop}" stroke="${VIZ.muted}" stroke-width="1.4" stroke-dasharray="5 4"/>`;

/* ── 드브로이 정상파: 왜 궤도가 불연속인가 ── */
function deBroglieWave(){
  const w=820, h=310, cy=140, R=76, A=17;
  const path=(cx,n)=>{
    let d=""; const seg=360;
    for(let i=0;i<=seg;i++){
      const t=i/seg*Math.PI*2, rr=R+A*Math.sin(n*t);
      d += (i?"L":"M")+(cx+rr*Math.cos(t)).toFixed(1)+" "+(cy+rr*Math.sin(t)).toFixed(1);
    }
    return d;
  };
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="드브로이 물질파 정상파 조건: 정수배일 때만 궤도가 허용된다">`;
  [[240,4,true],[580,4.4,false]].forEach(([cx,n,ok])=>{
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${VIZ.grid}" stroke-width="1.4" stroke-dasharray="4 4"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="11" fill="#f79a1e"/>`;
    s += `<path d="${path(cx,n)}" fill="none" stroke="${ok?VIZ.accent:"#e8552d"}" stroke-width="2.6" stroke-linejoin="round"/>`;
  });
  s += `<text x="240" y="40" text-anchor="middle" font-size="13.5" font-weight="800" fill="${VIZ.accent}">2πr = 4λ　— 허용</text>`;
  s += `<text x="240" y="${cy+R+44}" text-anchor="middle" font-size="12" fill="${VIZ.sub}">파장의 정수배가 딱 맞아 파가 스스로 보강됩니다.</text>`;
  s += `<text x="580" y="40" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e8552d">2πr ≠ nλ　— 불허용</text>`;
  s += `<text x="580" y="${cy+R+44}" text-anchor="middle" font-size="12" fill="${VIZ.sub}">한 바퀴 돌아온 파가 어긋나 스스로 상쇄됩니다.</text>`;
  s += `<circle cx="${(580+R+A).toFixed(1)}" cy="${cy}" r="7" fill="none" stroke="#e8552d" stroke-width="2"/>`;
  s += `<text x="${(580+R+A+14).toFixed(1)}" y="${cy+4}" font-size="11.5" font-weight="700" fill="#e8552d">어긋남</text>`;
  s += `<text x="410" y="${h-20}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${VIZ.ink}">2πr = nλ,　λ = h/mv　⇒　mvr = n·h/2π　(보어의 양자 조건)</text>`;
  return s+"</svg>";
}

    g += `<rect x="${bx}" y="${cy-72}" width="9" height="${72-gap}" fill="#4a5462"/>`;
    g += `<rect x="${bx}" y="${cy+gap}" width="9" height="${72-gap}" fill="#4a5462"/>`;

}

/* ── 원자의 불연속 준위가 결정 속에서 에너지 밴드가 되는 과정 ── */
function bandSplit(){
  const w=820, h=310, x0=200, x1=660;
  const env=(yc,maxS,top)=>{
    let d="";
    for(let i=0;i<=46;i++){
      const x=x0+(x1-x0)*i/46;
      const f=Math.pow((x1-x)/(x1-x0),2);
      const y=yc+(top?-1:1)*maxS*f/2;
      d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
    }
    return d;
  };
  const at=(x,yc,maxS,top)=>{ const f=Math.pow((x1-x)/(x1-x0),2); return yc+(top?-1:1)*maxS*f/2; };
  const CY_C=95, S_C=95, CY_V=212, S_V=112;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원자의 불연속 에너지 준위가 결정 속에서 에너지 밴드로 갈라지는 과정">`;
  s += `<path d="${env(CY_C,S_C,true)} L${x1} ${CY_C} ${env(CY_C,S_C,false).replace("M","L")}" fill="none"/>`;
  /* 밴드 영역 채우기 */
  const band=(yc,maxS,fill)=>{
    let d=env(yc,maxS,true);
    for(let i=46;i>=0;i--){
      const x=x0+(x1-x0)*i/46, f=Math.pow((x1-x)/(x1-x0),2);
      d+="L"+x.toFixed(1)+" "+(yc+maxS*f/2).toFixed(1);
    }
    return `<path d="${d}Z" fill="${fill}" stroke="${VIZ.blue}" stroke-width="1.4"/>`;
  };
  s += band(CY_C,S_C,"#dcebfb");
  s += band(CY_V,S_V,"#bcd9f6");

  /* 고립 원자의 불연속 준위 */
  s += `<line x1="${x1}" y1="${CY_C}" x2="${x1+80}" y2="${CY_C}" stroke="${VIZ.ink}" stroke-width="2.4"/>`;
  s += `<line x1="${x1}" y1="${CY_V}" x2="${x1+80}" y2="${CY_V}" stroke="${VIZ.ink}" stroke-width="2.4"/>`;
  s += `<text x="${x1+86}" y="${CY_C+4}" font-size="11.5" font-weight="700" fill="${VIZ.sub}">빈 준위</text>`;
  s += `<text x="${x1+86}" y="${CY_V+4}" font-size="11.5" font-weight="700" fill="${VIZ.sub}">가전자 준위</text>`;
  s += `<text x="${x1+40}" y="${h-52}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">고립된 원자 1개</text>`;

  /* 실제 격자 간격 */
  const XE=340;
  const cB=at(XE,CY_C,S_C,false), vT=at(XE,CY_V,S_V,true);
  s += `<line x1="${XE}" y1="40" x2="${XE}" y2="${h-60}" stroke="${VIZ.accent}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  s += `<line x1="${XE}" y1="${cB.toFixed(1)}" x2="${XE}" y2="${vT.toFixed(1)}" stroke="${VIZ.accent}" stroke-width="2.4"/>`;
  s += `<path d="M${XE-5} ${(cB+8).toFixed(1)} L${XE+5} ${(cB+8).toFixed(1)} L${XE} ${cB.toFixed(1)} Z" fill="${VIZ.accent}"/>`;
  s += `<path d="M${XE-5} ${(vT-8).toFixed(1)} L${XE+5} ${(vT-8).toFixed(1)} L${XE} ${vT.toFixed(1)} Z" fill="${VIZ.accent}"/>`;
  s += `<text x="${XE+10}" y="${((cB+vT)/2+5).toFixed(1)}" font-size="14" font-weight="800" fill="${VIZ.accent}">E<tspan font-size="10" dy="3">g</tspan></text>`;
  s += `<text x="${XE+10}" y="${((cB+vT)/2+22).toFixed(1)}" font-size="11" fill="${VIZ.accent}">밴드갭</text>`;
  s += `<text x="${XE}" y="34" text-anchor="middle" font-size="11.5" font-weight="700" fill="${VIZ.accent}">실제 결정의 격자 간격</text>`;

  s += `<text x="228" y="${at(250,CY_C,S_C,true).toFixed(1)}" font-size="12.5" font-weight="800" fill="${VIZ.ink}" dy="26">전도대</text>`;
  s += `<text x="228" y="${at(250,CY_V,S_V,true).toFixed(1)}" font-size="12.5" font-weight="800" fill="${VIZ.ink}" dy="30">가전자대</text>`;

  /* 축 */
  s += `<line x1="170" y1="30" x2="170" y2="${h-56}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<path d="M165 34 L175 34 L170 24 Z" fill="${VIZ.axis}"/>`;
  s += `<text x="150" y="${h-140}" text-anchor="middle" font-size="12" font-weight="700" fill="${VIZ.sub}" transform="rotate(-90 150 ${h-140})">에너지</text>`;
  s += `<line x1="170" y1="${h-56}" x2="770" y2="${h-56}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<path d="M766 ${h-61} L766 ${h-51} L776 ${h-56} Z" fill="${VIZ.axis}"/>`;
  s += `<text x="470" y="${h-34}" text-anchor="middle" font-size="12" fill="${VIZ.sub}">원자 사이의 거리 →　(왼쪽으로 갈수록 원자들이 가까워져 결정이 된다)</text>`;
  s += `<text x="230" y="${h-72}" font-size="11.5" fill="${VIZ.muted}">← 결정(고체)</text>`;
  return s+"</svg>";
}

/* .card / .callout 을 아코디언으로 변환 (수업 중 접었다 펴기) */
function setupAccordions(view){
  const heads = view.querySelectorAll(".card > h3, .callout > h3");
  if(!heads.length) return;
  heads.forEach(h3=>{
    const box = h3.parentElement;
    const d = document.createElement("details");
    d.className = box.className + " acc";
    d.open = true;
    const sm = document.createElement("summary");
    sm.innerHTML = h3.innerHTML;
    h3.remove();
    d.appendChild(sm);
    const body = document.createElement("div");
    while(box.firstChild) body.appendChild(box.firstChild);
    d.appendChild(body);
    box.replaceWith(d);
  });
  const first = view.querySelector("details.acc");
  if(!first) return;
  const bar = document.createElement("div");
  bar.className = "acc-bar";
  bar.innerHTML = `<button class="acc-btn" data-acc="open">＋ 모두 펼치기</button><button class="acc-btn" data-acc="close">－ 모두 접기</button>`;
  first.parentNode.insertBefore(bar, first);
  bar.querySelectorAll("[data-acc]").forEach(b=>{
    b.onclick = ()=>{ view.querySelectorAll("details.acc").forEach(d=> d.open = (b.dataset.acc === "open")); };
  });
}

    <p class="chart-note">전자가 파동이라는 것은 상상이 아니라 실험 사실입니다. 1927년 데이비슨·거머는 니켈 결정에 전자빔을 쏘아 <b>빛과 똑같은 회절 무늬</b>를 얻었습니다.</p>

    측정 기술이 부족해서가 아니라, 파동으로서의 입자가 가진 본질입니다. 그런데 '궤도'란 매 순간의 위치와 속도를 모두 지정하는 개념이므로,
    이 원리가 옳다면 <b>전자의 궤도라는 말 자체가 성립하지 않습니다</b>. 보어 모형의 동그란 궤도 그림이 사라진 이유입니다.</p>
    <div class="chart-wrap">${uncertaintySlit()}</div>
    <p class="chart-note">슬릿을 좁혀 전자의 위치를 정확히 알아내려 할수록, 뒤쪽 스크린의 회절 무늬는 오히려 넓게 퍼집니다 — 운동량의 불확정성이 커진 것입니다.
    한쪽을 줄이면 반드시 다른 쪽이 늘어나며, 그 곱은 결코 ħ/2 아래로 내려가지 않습니다.</p>
  </div>

  <div class="card">
    <h3>🔮 현대의 원자 — 궤도 대신 오비탈</h3>
    <div class="chart-wrap">${orbitalShapes()}</div>
    <p class="chart-note">현대의 원자 그림에는 선으로 된 궤도가 없고, 대신 <b>어디서 발견될 확률이 얼마나 높은지</b>를 나타내는 구름(오비탈)만 있습니다.
    흥미로운 점은 수소 1s 오비탈에서 전자가 발견될 확률이 가장 높은 거리가 <b>0.529 Å</b>, 즉 보어가 계산한 반지름과 정확히 같다는 것입니다.
    보어 모형은 틀린 그림이었지만 <b>쓸모 있는 근사</b>였던 셈입니다.</p>

  <div class="card">
    <h3>📋 다섯 모형 한눈에 비교</h3>
    <div class="mat-table-wrap"><table class="mat-table">
      <thead><tr><th>모형</th><th>근거가 된 실험·이론</th><th>설명할 수 있었던 것</th><th>설명하지 못한 것</th></tr></thead>
      <tbody>${ATOM_COMPARE.map(r=>`<tr${r[4]?' class="hl-row"':''}><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>

  <div class="card">
    <h3>🎓 왜 이미 틀린 모형을 공대에서 아직도 배울까?</h3>
    <p class="mat-section-note">여기까지 오면 당연히 이런 의문이 듭니다. <b>"보어 모형은 틀린 것으로 판명됐는데, 왜 전자공학 1장에서 또 보어 모형이 나올까?"</b><br>
    실제로 반도체 소자 물리의 표준 교재들(Streetman, Neamen, Pierret)은 하나같이 1장 서두를 보어 모형과 수소 원자 에너지 준위 계산으로 시작합니다.
    이것은 물리를 대충 가르치는 타협이 아니라, <b>공학적 추상화(Engineering Abstraction)</b>라는 분명한 선택입니다. 이유는 세 가지입니다.</p>

    <p class="sub-h">① 보어의 '에너지 사다리'가 곧 밴드 다이어그램이다</p>
    <p class="mat-section-note">보어 모형의 가장 큰 공학적 기여는 궤도 그림이 아니라 <b>"에너지는 불연속적인 층(level)으로 존재한다"</b>는 개념입니다.
    파동함수 ψ를 풀면 전자가 어디서 발견될지를 3차원 확률분포 |ψ|²로 정확히 알 수 있지만, 소자를 해석하는 엔지니어에게 3차원 확률 구름은 불필요하게 복잡합니다.
    우리에게 중요한 변수는 '전자가 공간의 어느 각도에 있는가'가 아니라 <b>'전자가 어떤 에너지 레벨에 있고, 전압이 걸리면 어느 방향으로 흐르는가'</b>이기 때문입니다.</p>
    <p class="mat-section-note">원자가 결정 격자로 모이면 이웃한 원자들의 준위가 <b>파울리 배타 원리</b> 때문에 서로 밀어내며 촘촘하게 갈라집니다.
    그 결과가 <b>가전자대 · 전도대 · 밴드갭(E<sub>g</sub>)</b>이라는, 보어의 사다리를 그대로 확장한 1차원 에너지 도로망입니다.</p>
    <div class="chart-wrap">${bandSplit()}</div>
    <p class="chart-note">고립된 원자 하나의 불연속 준위(오른쪽)가, 원자들이 가까워질수록 갈라져 폭을 가진 <b>밴드</b>가 됩니다.
    실제 결정의 격자 간격에서 남아 있는 틈이 밴드갭입니다.</p>
    <div class="chart-wrap">${bandTypes()}</div>
    <p class="chart-note">1장에서 배우는 Si·Ge·GaAs의 차이, n형·p형, 공유결합은 전부 이 그림 위에서 이야기됩니다.
    실리콘의 최외각 전자가 <b>4개</b>라는 사실 하나가 반도체 산업 전체의 출발점입니다.</p>

    <p class="sub-h">② 도핑 계산에 보어의 공식을 그대로 가져다 쓴다</p>
    <p class="mat-section-note">보어 모형은 비유에 그치지 않습니다. 실리콘에 인(P, 5족)을 도핑하면 결합에 쓰이지 못한 전자 하나가 P⁺ 이온에 약하게 묶이는데,
    이 관계는 <b>핵 하나에 전자 하나</b>라는 점에서 수소 원자와 구조가 같습니다. 그래서 보어의 결합 에너지 식을 그대로 쓰되,
    진공 대신 실리콘의 <b>비유전율 ε<sub>r</sub> ≈ 11.7</b>과 전자의 <b>유효 질량 m*</b>를 넣습니다.</p>
    <div class="calc">
      <span class="eq">E<sub>d</sub> = 13.6 eV × (m*/m₀) / ε<sub>r</sub>²</span>
      실리콘: m*/m₀ ≈ <span class="num">0.26</span>, ε<sub>r</sub> = <span class="num">11.7</span> 이므로<br>
      E<sub>d</sub> ≈ 13.6 × 0.26 / 11.7² ≈ <span class="num">0.026 eV</span> — 실측값은 <span class="num">0.04 ~ 0.05 eV</span> 수준입니다.
      <p class="calc-note">한 줄짜리 근사식이 실측값과 <b>같은 자릿수</b>로 맞아떨어집니다. 무엇보다 중요한 것은 이 값이 실리콘의 밴드갭 1.12 eV의 <b>약 1/25</b>밖에 안 된다는 점 —
      도펀트 준위가 밴드 가장자리에 아주 가까이 붙어 있는 <b>얕은 준위(shallow level)</b>라는 뜻입니다.
      그래서 상온에서 도펀트는 사실상 전부 이온화되어 캐리어를 내놓습니다.</p>
      <p class="calc-note"><b>여기서 이런 질문이 나옵니다.</b> "상온의 열에너지는 kT ≈ 0.026 eV인데, 도너 이온화 에너지 0.045 eV가 더 크잖아요?"
      좋은 지적입니다. kT는 <b>평균값</b>일 뿐이고 실제 전자들의 에너지는 넓게 분포하므로 그보다 큰 에너지를 가진 전자가 얼마든지 있습니다.
      게다가 전도대에는 <b>도너 수와 비교할 수 없이 많은 빈 자리</b>가 있어서, 전자가 도너에 묶여 있기보다 전도대로 흩어져 있는 쪽이 압도적으로 유리합니다.
      두 이유가 합쳐져 상온에서는 도너의 거의 전부가 이온화됩니다. 반대로 온도를 아주 낮추면 전자가 다시 도너에 붙잡히는데(<b>캐리어 동결</b>), 이것이 극저온에서 반도체 소자가 동작하지 않는 이유입니다.</p>
    </div>
    <div class="mat-table-wrap"><table class="mat-table">
      <thead><tr><th>불순물</th><th>종류</th><th>이온화 에너지 (실리콘 기준)</th></tr></thead>
      <tbody>${DOPANTS.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="mat-section-note">※ 밴드갭(1.12 eV)에 비해 모두 <b>수십 분의 1</b> 수준입니다. 4장의 바이어싱, 5장의 소신호 해석이 "도펀트는 전부 이온화되어 있다"는 전제 위에서
    출발할 수 있는 근거가 바로 이 표입니다.</p>

    <p class="sub-h">③ 공학은 '불필요한 자유도'를 덜어내는 일이다</p>
    <div class="mat-table-wrap"><table class="mat-table">
      <thead><tr><th>　</th><th>물리학 (Physics)</th><th>공학 (Engineering)</th></tr></thead>
      <tbody>${PHYS_ENG.map(r=>`<tr${r[3]?' class="hl-row"':''}><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="mat-section-note">회로를 해석할 때 우리는 맥스웰 방정식을 풀지 않고 옴의 법칙과 KCL·KVL을 씁니다.
    맥스웰 방정식이 틀려서가 아니라, 회로 크기가 파장보다 훨씬 작을 때는 그 압축된 모델만으로 <b>정확히 예측하고 설계할 수 있기</b> 때문입니다.
    소자 수준에서도 마찬가지로, 보어가 준 에너지 준위 직관만으로 다이오드·BJT·MOSFET이 <b>왜 그렇게 동작하는지</b>를 일관되게 설명하고 해석할 수 있습니다.</p>

    <div class="quote">
      물리학과에서는 전자가 어디에 있는지 3차원 공간 확률(오비탈)을 끝까지 추적합니다.
      하지만 우리 반도체 엔지니어에게 중요한 것은 <b>"이 전자가 에너지를 얼마나 가졌고, 밴드갭을 넘어 전류로 흐를 수 있는가"</b>입니다.<br>
      보어 모형은 복잡한 3차원 구름을 <b>'에너지 사다리'</b>라는 간결한 도구로 압축해 준 모델입니다.
      실제로 실리콘에 불순물을 넣었을 때 얼마의 에너지가 필요한지 계산할 때도 우리는 여전히 보어의 수소 방정식을 가져다 씁니다.<br>
      자연의 완벽한 묘사보다 <b>'현상을 정확히 예측하고 제어할 수 있는 가장 효율적인 모델'</b>을 선택하는 것 — 그것이 바로 <b>공학적 추상화</b>입니다.
    </div>
  </div>

  <div class="card">
    <h3>▶️ 참고 영상</h3>

      ${ATOM_VIDEOS.map(v=>`

  <div class="card">
    <h3>📝 확인 문제 — 단답형 (Ch.1 반도체 기초)</h3>
    <p class="quiz-lead">모든 문항은 <b>수식과 계산 없이 문장으로</b> 답하도록 만들어졌습니다. 외워야 할 숫자는 없습니다 — 개념을 자기 말로 설명할 수 있는지가 기준입니다. 먼저 답을 적어 본 뒤 '정답 보기'를 누르세요. 원자모형에서 출발해 1장 반도체 기초로 이어지는 순서입니다.</p>

    <p class="quiz-lead">답안지 반 쪽 분량을 기준으로 합니다. 역시 <b>수식 없이 서술형으로</b> 답합니다. 모범답안과 함께 채점 포인트를 적어두었으니 스스로 채점해 보세요 — 포인트를 몇 개나 짚었는지가 곧 이해도입니다.</p>
    ${QUIZ_LONG.map((x,i)=>`

function speedLadder(){
  const w=820, h=250, p={l:58,r:58}, axY=138;
  const x0=Math.log10(1e-5), x1=Math.log10(1e9);
  const x = v => p.l + (Math.log10(v)-x0)/(x1-x0)*(w-p.l-p.r);
  const ticks=[[1e-4,"0.1mm/s"],[1e-2,"1cm/s"],[1,"1m/s"],[1e2,"100m/s"],[1e4,"10km/s"],[1e6,"1,000km/s"],[1e8,"10만km/s"]];
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전자의 드리프트 속도와 전기 신호 전파 속도 비교">`;
  s += `<line x1="${p.l}" y1="${axY}" x2="${w-p.r}" y2="${axY}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  ticks.forEach(([v,t])=>{
    s += `<line x1="${x(v)}" y1="${axY-4}" x2="${x(v)}" y2="${axY+4}" stroke="${VIZ.axis}" stroke-width="1"/>`;
    s += `<text x="${x(v)}" y="${axY+40}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">${t}</text>`;
  });
  SPEEDS.forEach(it=>{
    const cx=x(it.v), c=it.hl?VIZ.accent:VIZ.blue;
    const ly = it.up ? axY-52 : axY+62;
    s += `<line x1="${cx}" y1="${axY}" x2="${cx}" y2="${it.up?axY-34:axY+52}" stroke="${c}" stroke-width="1" stroke-dasharray="2 3"/>`;
    s += `<circle cx="${cx}" cy="${axY}" r="${it.hl?7:5}" fill="${c}" stroke="#fff" stroke-width="2"><title>${it.t} · ${it.d}</title></circle>`;
    s += `<text x="${cx}" y="${it.up?ly-14:ly}" text-anchor="middle" font-size="${it.hl?13:12}" font-weight="${it.hl?800:700}" fill="${it.hl?VIZ.accent:VIZ.ink}">${it.t}</text>`;
    s += `<text x="${cx}" y="${it.up?ly:ly+15}" text-anchor="middle" font-size="11" fill="${VIZ.sub}">${it.d}</text>`;
  });
  return s+"</svg>";
}

  s += `<marker id="efA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${VIZ.accent}"/></marker>`;

  s += `</defs>`;

  /* 도선 사이 = 전자기장이 채워진 공간 */
  s += `<rect x="${xL}" y="${yT}" width="${xR-xL}" height="${yB-yT}" fill="#eef3ff"/>`;
  [180,260,340,420,500,580,660].forEach(x=>{
    s += `<line x1="${x}" y1="${yT+8}" x2="${x}" y2="${yB-32}" stroke="#93b5e8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#efC)"/>`;
  });
  [235,375,515,655].forEach(x=>{
    s += `<circle cx="${x}" cy="${yT+22}" r="7" fill="#fff" stroke="${VIZ.sub}" stroke-width="1.2"/>`;
    s += `<path d="M${x-4.5} ${yT+17.5} L${x+4.5} ${yT+26.5} M${x+4.5} ${yT+17.5} L${x-4.5} ${yT+26.5}" stroke="${VIZ.sub}" stroke-width="1.2"/>`;
  });
  s += `<text x="435" y="${yT+56}" text-anchor="middle" font-size="13.5" font-weight="800" fill="${VIZ.accent}">에너지 흐름  S = E × H</text>`;
  [[200,330],[370,500],[540,670]].forEach(([a,b])=>{

  /* 도선 */
  s += `<line x1="${xL}" y1="${yT}" x2="${xR}" y2="${yT}" stroke="${VIZ.ink}" stroke-width="5" stroke-linecap="round"/>`;
  s += `<line x1="${xL}" y1="${yB}" x2="${xR}" y2="${yB}" stroke="${VIZ.ink}" stroke-width="5" stroke-linecap="round"/>`;

  /* 전지 */
  s += `<line x1="${xL}" y1="${yT}" x2="${xL}" y2="178" stroke="${VIZ.ink}" stroke-width="5" stroke-linecap="round"/>`;
  s += `<line x1="${xL}" y1="192" x2="${xL}" y2="${yB}" stroke="${VIZ.ink}" stroke-width="5" stroke-linecap="round"/>`;
  s += `<line x1="${xL-22}" y1="178" x2="${xL+22}" y2="178" stroke="${VIZ.ink}" stroke-width="3.5"/>`;
  s += `<line x1="${xL-12}" y1="192" x2="${xL+12}" y2="192" stroke="${VIZ.ink}" stroke-width="3.5"/>`;
  s += `<text x="${xL-32}" y="172" text-anchor="end" font-size="14" font-weight="800" fill="${VIZ.ink}">＋</text>`;
  s += `<text x="${xL-32}" y="200" text-anchor="end" font-size="14" font-weight="800" fill="${VIZ.ink}">－</text>`;

  /* 전구 */
  s += `<line x1="${xR}" y1="${yT}" x2="${xR}" y2="161" stroke="${VIZ.ink}" stroke-width="5" stroke-linecap="round"/>`;
  s += `<line x1="${xR}" y1="209" x2="${xR}" y2="${yB}" stroke="${VIZ.ink}" stroke-width="5" stroke-linecap="round"/>`;
  s += `<circle cx="${xR}" cy="185" r="24" fill="#fffbe8" stroke="${VIZ.ink}" stroke-width="2.5"/>`;
  s += `<path d="M${xR-15} 170 L${xR+15} 200 M${xR+15} 170 L${xR-15} 200" stroke="${VIZ.ink}" stroke-width="2"/>`;
  s += `<text x="${xR+34}" y="190" font-size="12.5" font-weight="700" fill="${VIZ.ink}">전구</text>`;

  /* 도선 위: 관용 전류 / 전자 드리프트 */
  s += `<line x1="230" y1="95" x2="320" y2="95" stroke="${VIZ.sub}" stroke-width="2" marker-end="url(#efB)"/>`;
  s += `<text x="330" y="99" font-size="12.5" font-weight="700" fill="${VIZ.sub}">I (관용 전류)</text>`;
  s += `<line x1="600" y1="95" x2="530" y2="95" stroke="${VIZ.sub}" stroke-width="2" marker-end="url(#efB)"/>`;
  s += `<text x="610" y="99" font-size="12.5" font-weight="700" fill="${VIZ.sub}">e⁻ 약 0.07 mm/s</text>`;

  /* 범례 */
  s += `<text x="435" y="292" text-anchor="middle" font-size="12" fill="${VIZ.muted}">점선 화살표 = 전기장 E · ⊗ = 지면 안쪽으로 들어가는 자기장 B · 굵은 화살표 = 포인팅 벡터 S</text>`;
  s += `<text x="435" y="313" text-anchor="middle" font-size="12" fill="${VIZ.muted}">전자는 도선 안에서 느리게 밀려갈 뿐이고, 에너지는 도선 바깥 공간의 장을 타고 전구로 갑니다.</text>`;
  return s+"</svg>";
}

      다이오드가 꺼지는 속도는 전자가 이동한 거리가 아니라, 축적된 소수 캐리어가 사라지는 데 걸리는 시간(역회복시간 t<sub>rr</sub>)이 결정합니다.</p></div>

      소자의 속도 한계는 전하와 장을 재배치하는 시간에서 옵니다.</p></div>

/* 두 개의 분류축을 한 장에 — 세로: 무엇을 만드나 / 가로: 어떻게 사업하나 */
function chipMatrix(){
  const w=820, h=456, LW=132, GAP=8, CW=220, X0=LW+GAP;
  const cols=[
    {t:"IDM", s:"설계 + 제조 + 판매"},
    {t:"팹리스 (Fabless)", s:"설계만 · 제조는 위탁"},
    {t:"파운드리 (Foundry)", s:"제조만 · 남의 설계를 생산"},
  ];
  const cells=[
    [ {co:["삼성전자","SK하이닉스","마이크론","키옥시아 · 샌디스크"], hl:true},
      {none:"사실상 없음", why:"메모리는 제품이 표준화돼 있어 설계와 공정을 나눌 이유가 적다"},
      {none:"거의 없음", why:"메모리는 자기 공장에서 자기 제품을 만든다"} ],
    [ {co:["인텔","텍사스 인스트루먼트","인피니언 · ST"], note:"인텔은 최근 파운드리도 함께"},
      {co:["NVIDIA","AMD · 퀄컴","브로드컴 · 미디어텍","애플(자사용)"], hl:true},
      {co:["TSMC","삼성 파운드리","UMC · GlobalFoundries"], hl:true} ],
  ];
  const rows=[{t:"메모리", s:"DRAM · NAND"},{t:"비메모리", s:"CPU · GPU · AP"}];
  const RY=[74, 254], RH=170;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="반도체 회사를 메모리/비메모리와 IDM/팹리스/파운드리 두 축으로 나눈 표">`;
  cols.forEach((c,i)=>{
    const x = X0 + i*(CW+GAP);
    s += `<text x="${x+CW/2}" y="34" text-anchor="middle" font-size="14" font-weight="800" fill="${VIZ.ink}">${c.t}</text>`;
    s += `<text x="${x+CW/2}" y="54" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">${c.s}</text>`;
  });
  rows.forEach((r,ri)=>{
    s += `<text x="${LW-10}" y="${RY[ri]+RH/2-6}" text-anchor="end" font-size="14" font-weight="800" fill="${VIZ.ink}">${r.t}</text>`;
    s += `<text x="${LW-10}" y="${RY[ri]+RH/2+14}" text-anchor="end" font-size="11" fill="${VIZ.muted}">${r.s}</text>`;
    cells[ri].forEach((cell,ci)=>{
      const x = X0 + ci*(CW+GAP);
      const empty = !!cell.none;
      s += `<rect x="${x}" y="${RY[ri]}" width="${CW}" height="${RH}" rx="12" fill="${empty?"#f6f7f9":(cell.hl?"#eef3ff":"#fff")}" stroke="${empty?VIZ.grid:(cell.hl?VIZ.accent:VIZ.grid)}" stroke-width="${cell.hl?1.6:1.2}"/>`;
      if(empty){
        s += `<text x="${x+CW/2}" y="${RY[ri]+56}" text-anchor="middle" font-size="14" font-weight="800" fill="#9aa3b0">${cell.none}</text>`;
        const words = cell.why.split(" ");
        let line="", ln=0;
        words.forEach(wd=>{
          if((line+wd).length > 15){ s += `<text x="${x+CW/2}" y="${RY[ri]+84+ln*18}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">${line}</text>`; line=wd+" "; ln++; }
          else line += wd+" ";
        });
        s += `<text x="${x+CW/2}" y="${RY[ri]+84+ln*18}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">${line}</text>`;
      }else{
        cell.co.forEach((n,k)=>{
          s += `<text x="${x+CW/2}" y="${RY[ri]+38+k*26}" text-anchor="middle" font-size="13.5" font-weight="${k===0?800:600}" fill="${k===0?VIZ.accent:"#3f4855"}">${n}</text>`;
        });
        if(cell.note) s += `<text x="${x+CW/2}" y="${RY[ri]+RH-16}" text-anchor="middle" font-size="11" fill="${VIZ.muted}">${cell.note}</text>`;
      }
    });
  });
  s += `<text x="${X0}" y="${h-12}" font-size="11.5" fill="${VIZ.muted}">※ 삼성전자는 메모리 IDM과 파운드리, 두 칸에 동시에 등장합니다 — 한 단어로 부르기 어려운 회사입니다.</text>`;
  return s+"</svg>";
}

/* HBM은 왜 메모리 회사가 만드는데 포장은 파운드리가 하는가 */
function hbmStack(){
  const w=820, h=310, subY=248, intY=214, base=210;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="인터포저 위에 GPU 다이와 HBM 적층이 함께 올라간 구조">`;
  s += `<rect x="90" y="${subY}" width="640" height="30" rx="5" fill="#3f4855"/>`;
  s += `<text x="410" y="${subY+20}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">패키지 기판 (substrate)</text>`;
  s += `<rect x="130" y="${intY}" width="560" height="30" rx="4" fill="#c9d4e4" stroke="#94a3b8" stroke-width="1.2"/>`;
  s += `<text x="410" y="${intY+20}" text-anchor="middle" font-size="12" font-weight="700" fill="#3f4855">인터포저 (실리콘 중계 기판)</text>`;
  /* GPU 다이 */
  s += `<rect x="330" y="128" width="160" height="82" rx="6" fill="#d7f0e4" stroke="#0f9d6e" stroke-width="1.8"/>`;
  s += `<text x="410" y="164" text-anchor="middle" font-size="14" font-weight="800" fill="#0a7d57">GPU 다이</text>`;
  s += `<text x="410" y="184" text-anchor="middle" font-size="11" fill="#0a7d57">팹리스가 설계 · 파운드리가 제조</text>`;
  /* HBM 적층 */
  [[180,"DRAM 다이 적층 + TSV 관통"],[540,"맨 아래는 베이스 다이"]].forEach(([x,cap])=>{
    for(let i=0;i<5;i++){
      const y = base - 16 - i*17;
      const isBase = (i===0);
      s += `<rect x="${x}" y="${y}" width="100" height="15" rx="2.5" fill="${isBase?"#f6c9bb":"#fbe0d7"}" stroke="#e8552d" stroke-width="1.2"/>`;
    }
    /* TSV */
    [x+22, x+50, x+78].forEach(tx=>{
      s += `<line x1="${tx}" y1="${base-16-4*17}" x2="${tx}" y2="${base-2}" stroke="#c23c17" stroke-width="1.3" stroke-dasharray="3 2"/>`;
    });
    s += `<text x="${x+50}" y="${base-16-5*17-8}" text-anchor="middle" font-size="13" font-weight="800" fill="#c23c17">HBM</text>`;
    s += `<text x="${x+50}" y="${base-16-5*17+8}" text-anchor="middle" font-size="10.5" fill="#c23c17">${cap}</text>`;
  });
  s += `<text x="20" y="26" font-size="13.5" font-weight="800" fill="${VIZ.ink}">HBM — 메모리 회사가 만들지만, 붙이는 것은 파운드리</text>`;
  s += `<text x="20" y="46" font-size="12" fill="${VIZ.sub}">HBM은 새로운 종류의 메모리가 아니라 <tspan font-weight="800">DRAM을 위로 쌓아 통로를 넓힌 것</tspan>입니다. 그래서 DRAM 3사가 만듭니다.</text>`;
  s += `<text x="20" y="${h-8}" font-size="12" fill="${VIZ.muted}">그런데 GPU 옆에 나란히 올려 붙이는 공정(TSMC의 CoWoS 같은 첨단 패키징)은 파운드리의 몫입니다.</text>`;
  return s+"</svg>";
}

/* 네 힘의 상대적 세기 — 로그 축 하나에 올려놓으면 중력의 위치가 보인다 */
function forceLadder(){
  const w=820, h=250, p={l:60,r:60}, axY=140;
  const x0=-41, x1=1.5;
  const x = e => p.l + (e-x0)/(x1-x0)*(w-p.l-p.r);
  const ticks=[[0,"1"],[-10,"10⁻¹⁰"],[-20,"10⁻²⁰"],[-30,"10⁻³⁰"],[-40,"10⁻⁴⁰"]];
  const items=[
    {e:0,   t:"강한 상호작용", d:"기준 (가장 강함)", up:true,  c:VIZ.accent},
    {e:-2,  t:"전자기력",      d:"약 100분의 1",     up:false, c:"#e8552d"},
    {e:-6,  t:"약한 상호작용", d:"약 100만분의 1",   up:true,  c:VIZ.blue},
    {e:-38, t:"중력",          d:"10³⁸분의 1 수준",  up:false, c:"#7b8794"},
  ];
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네 가지 기본 상호작용의 상대적 세기를 로그 축에 표시한 그림">`;
  s += `<line x1="${p.l}" y1="${axY}" x2="${w-p.r}" y2="${axY}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  ticks.forEach(([e,t])=>{
    s += `<line x1="${x(e)}" y1="${axY-4}" x2="${x(e)}" y2="${axY+4}" stroke="${VIZ.axis}" stroke-width="1"/>`;
    s += `<text x="${x(e)}" y="${axY+38}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">${t}</text>`;
  });
  items.forEach(it=>{
    const cx=x(it.e), ly = it.up ? axY-50 : axY+62;
    s += `<line x1="${cx}" y1="${axY}" x2="${cx}" y2="${it.up?axY-32:axY+52}" stroke="${it.c}" stroke-width="1" stroke-dasharray="2 3"/>`;
    s += `<circle cx="${cx}" cy="${axY}" r="6" fill="${it.c}" stroke="#fff" stroke-width="2"/>`;
    s += `<text x="${cx}" y="${it.up?ly-14:ly}" text-anchor="middle" font-size="13" font-weight="800" fill="${it.c}">${it.t}</text>`;
    s += `<text x="${cx}" y="${it.up?ly:ly+15}" text-anchor="middle" font-size="11" fill="${VIZ.sub}">${it.d}</text>`;
  });
  s += `<text x="410" y="${h-10}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">가로축은 로그 눈금입니다 — 한 칸 갈 때마다 10배씩 차이가 납니다. 중력만 유독 멀리 떨어져 있습니다.</text>`;
  return s+"</svg>";
}

/* 전자기력 하나가 반도체까지 — 이 페이지의 뼈대 */
function forceTree(){
  const w=820, h=400;
  const bx=(x,y,bw,bh,t,sub,c,fill)=>{
    let g=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="${fill||"#fff"}" stroke="${c}" stroke-width="1.7"/>`;
    g+=`<text x="${x+bw/2}" y="${y+(sub?24:bh/2+5)}" text-anchor="middle" font-size="13.5" font-weight="800" fill="${c}">${t}</text>`;
    if(sub) g+=`<text x="${x+bw/2}" y="${y+42}" text-anchor="middle" font-size="11" fill="${VIZ.sub}">${sub}</text>`;
    return g;
  };
  const down=(x,y1,y2)=>`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2-8}" stroke="${VIZ.axis}" stroke-width="2"/><path d="M${x-5} ${y2-9} L${x+5} ${y2-9} L${x} ${y2} Z" fill="${VIZ.axis}"/>`;
  const right=(x1,x2,y)=>`<line x1="${x1}" y1="${y}" x2="${x2-8}" y2="${y}" stroke="${VIZ.axis}" stroke-width="2"/><path d="M${x2-9} ${y-5} L${x2-9} ${y+5} L${x2} ${y} Z" fill="${VIZ.axis}"/>`;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="네 가지 기본 힘 중 전자기력이 원자와 화학결합을 거쳐 반도체로 이어지는 흐름">`;
  s += `<text x="20" y="22" font-size="12" font-weight="800" fill="${VIZ.muted}">자연계의 기본 상호작용 4가지</text>`;
  const t4=[["중력","#7b8794"],["전자기력","#e8552d"],["강한 상호작용","#7b8794"],["약한 상호작용","#7b8794"]];
  t4.forEach(([t,c],i)=>{
    const x = 40 + i*190;
    s += bx(x, 34, 170, 46, t, "", c, c==="#e8552d" ? "#fdeceb" : "#f6f7f9");
  });
  s += down(315, 80, 108);
  s += bx(170, 108, 290, 52, "원자", "핵(+)과 전자(−)가 전자기력으로 묶인 것", "#e8552d", "#fff");
  s += down(315, 160, 196);
  s += `<text x="20" y="190" font-size="12" font-weight="800" fill="${VIZ.muted}">전자기력에서 파생된 결합들</text>`;
  const bonds=[["공유결합","Si·C"],["이온결합","NaCl"],["금속결합","Cu"],["수소결합","H₂O"],["반데르발스","분자 사이"]];
  bonds.forEach(([t,sub],i)=>{
    const x = 32 + i*153;
    const first = (i===0);
    s += bx(x, 196, 145, 56, t, sub, first?VIZ.accent:"#7b8794", first?"#eef3ff":"#fff");
  });
  s += down(104, 252, 288);
  s += `<text x="20" y="282" font-size="12" font-weight="800" fill="${VIZ.muted}">그리고 1장으로</text>`;
  const chain=[["Si 결정","공유결합 4개"],["에너지 밴드","준위가 갈라짐"],["반도체 소자","다이오드·BJT"]];
  chain.forEach(([t,sub],i)=>{
    const x = 32 + i*250;
    s += bx(x, 288, 220, 56, t, sub, VIZ.accent, "#eef3ff");
    if(i<2) s += right(x+220, x+250, 316);
  });
  s += `<text x="20" y="${h-10}" font-size="12" fill="${VIZ.sub}">네 가지 힘 중 <tspan font-weight="800" fill="#e8552d">전자기력 하나만</tspan> 따라가면 원자에서 반도체 소자까지 끊기지 않고 이어집니다.</text>`;
  return s+"</svg>";
}

/* 두 원자를 가까이 가져가면 에너지가 어떻게 변하는가 */
function bondEnergy(){
  const w=820, h=350, p={l:112,r:60,t:50,b:70};
  const iw=w-p.l-p.r, ih=h-p.t-p.b;
  const r0=0.95, r1=2.9;                 /* σ 단위 */
  const X = r => p.l + (r-r0)/(r1-r0)*iw;
  const eMax=1.6, eMin=-1.35;
  const Y = e => p.t + (eMax-e)/(eMax-eMin)*ih;
  const LJ = r => 4*(Math.pow(1/r,12)-Math.pow(1/r,6));
  const REP = r => 4*Math.pow(1/r,12);
  const ATT = r => -4*Math.pow(1/r,6);
  const path=(fn)=>{
    let d="";
    for(let i=0;i<=280;i++){
      const r = r0 + (r1-r0)*i/280, e = fn(r);
      if(e>eMax || e<eMin){ d=""; continue; }
      d += (d?"L":"M")+X(r).toFixed(1)+" "+Y(e).toFixed(1);
    }
    return d;
  };
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="두 원자 사이 거리에 따른 전체 에너지 곡선과 안정한 결합 거리">`;
  s += `<line x1="${p.l}" y1="${Y(0)}" x2="${w-p.r}" y2="${Y(0)}" stroke="${VIZ.grid}" stroke-width="1.4"/>`;
  s += `<text x="${w-p.r+4}" y="${Y(0)+4}" font-size="11" fill="${VIZ.muted}">0</text>`;
  s += `<line x1="${p.l}" y1="${p.t-10}" x2="${p.l}" y2="${h-p.b}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<line x1="${p.l}" y1="${h-p.b}" x2="${w-p.r}" y2="${h-p.b}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<text x="${p.l-14}" y="${p.t+6}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">에너지</text>`;
  s += `<text x="${w-p.r}" y="${h-p.b+24}" text-anchor="end" font-size="12" font-weight="700" fill="${VIZ.sub}">두 원자 사이의 거리 →</text>`;
  /* 성분 곡선 */
  s += `<path d="${path(REP)}" fill="none" stroke="#e8552d" stroke-width="1.6" stroke-dasharray="5 4" opacity=".8"/>`;
  s += `<path d="${path(ATT)}" fill="none" stroke="${VIZ.blue}" stroke-width="1.6" stroke-dasharray="5 4" opacity=".8"/>`;
  /* 합 */
  s += `<path d="${path(LJ)}" fill="none" stroke="${VIZ.ink}" stroke-width="2.8"/>`;
  /* 최소점 */
  const rmin=Math.pow(2,1/6), emin=LJ(rmin);
  s += `<line x1="${X(rmin)}" y1="${Y(emin)}" x2="${X(rmin)}" y2="${h-p.b}" stroke="${VIZ.accent}" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  s += `<line x1="${p.l}" y1="${Y(emin)}" x2="${X(rmin)}" y2="${Y(emin)}" stroke="${VIZ.accent}" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  s += `<circle cx="${X(rmin)}" cy="${Y(emin)}" r="6" fill="${VIZ.accent}" stroke="#fff" stroke-width="2"/>`;
  s += `<text x="${X(rmin)}" y="${h-p.b+22}" text-anchor="middle" font-size="12" font-weight="800" fill="${VIZ.accent}">결합 길이</text>`;
  s += `<text x="${p.l-14}" y="${Y(emin)+4}" text-anchor="end" font-size="11.5" font-weight="800" fill="${VIZ.accent}">가장 낮은 에너지</text>`;
  /* 주석 */
  s += `<text x="${X(1.02)}" y="${p.t+14}" font-size="11.5" font-weight="800" fill="#e8552d">반발</text>`;
  s += `<text x="${X(1.02)}" y="${p.t+30}" font-size="11" fill="#e8552d">전자끼리 밀어내고</text>`;
  s += `<text x="${X(1.02)}" y="${p.t+45}" font-size="11" fill="#e8552d">같은 자리에 못 있는다</text>`;
  s += `<text x="${X(2.15)}" y="${Y(-0.12)-10}" font-size="11.5" font-weight="800" fill="${VIZ.blue}">인력</text>`;
  s += `<text x="${X(2.15)}" y="${Y(-0.12)+6}" font-size="11" fill="${VIZ.blue}">전자가 두 핵 사이에 퍼지면 유리해진다</text>`;
  s += `<text x="${X(2.3)}" y="${Y(1.15)}" font-size="11.5" font-weight="800" fill="${VIZ.ink}">굵은 선 = 둘을 합친 전체 에너지</text>`;
  return s+"</svg>";
}

/* 중성인 원자끼리 왜 끌어당기나 — 순간 쌍극자 */
function vdwDipole(){
  const w=820, h=280;
  const atom=(cx,cy,shift,label,dl,dr)=>{
    let g = `<circle cx="${cx+shift}" cy="${cy}" r="46" fill="#cfe0f7" opacity=".75"/>`;
    g += `<circle cx="${cx}" cy="${cy}" r="7" fill="#e8552d"/>`;
    g += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">+</text>`;
    g += `<text x="${cx}" y="${cy+78}" text-anchor="middle" font-size="12" font-weight="700" fill="${VIZ.sub}">${label}</text>`;
    if(dl) g += `<text x="${cx-58}" y="${cy-52}" text-anchor="middle" font-size="14" font-weight="800" fill="${VIZ.blue}">${dl}</text>`;
    if(dr) g += `<text x="${cx+58}" y="${cy-52}" text-anchor="middle" font-size="14" font-weight="800" fill="#e8552d">${dr}</text>`;
    return g;
  };
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="중성 원자에서 순간적인 전하 치우침이 옆 원자에 쌍극자를 유도해 인력이 생기는 과정">`;
  s += `<text x="205" y="30" text-anchor="middle" font-size="13.5" font-weight="800" fill="${VIZ.ink}">평상시 — 전자가 고르게 퍼져 있다</text>`;
  s += atom(130, 130, 0, "중성");
  s += atom(280, 130, 0, "중성");
  s += `<text x="205" y="240" text-anchor="middle" font-size="12" fill="${VIZ.sub}">서로 끌어당길 이유가 없어 보인다</text>`;
  s += `<line x1="410" y1="60" x2="410" y2="230" stroke="${VIZ.grid}" stroke-width="1.4" stroke-dasharray="5 5"/>`;
  s += `<text x="615" y="30" text-anchor="middle" font-size="13.5" font-weight="800" fill="${VIZ.ink}">순간적으로 한쪽으로 치우치면</text>`;
  s += atom(540, 130, -11, "원자 A", "δ−", "δ+");
  s += atom(690, 130, -11, "원자 B (유도됨)", "δ−", "δ+");
  s += `<path d="M600 130 L630 130" stroke="#0f9d6e" stroke-width="2.4" marker-end="url(#vdA)"/>`;
  s += `<path d="M630 152 L600 152" stroke="#0f9d6e" stroke-width="2.4" marker-end="url(#vdA)"/>`;
  s += `<defs><marker id="vdA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f9d6e"/></marker></defs>`;
  s += `<text x="615" y="196" text-anchor="middle" font-size="12" font-weight="800" fill="#0f9d6e">약한 인력</text>`;
  s += `<text x="615" y="240" text-anchor="middle" font-size="12" fill="${VIZ.sub}">A의 치우침이 B에도 치우침을 만든다</text>`;
  s += `<text x="410" y="${h-8}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">전체로는 중성이어도 순간순간은 중성이 아닙니다 — 이 흔들림이 인력을 만듭니다.</text>`;
  return s+"</svg>";
}

/* 극장 좌석 비유 — 사람이 오른쪽으로 옮기면 빈자리는 왼쪽으로 */
function holeSeats(){
  const w=820, h=300, sw=64, gap=8, y0=60, y1=170;
  const row=(y, empty, label, arrow)=>{
    let g = `<text x="30" y="${y-14}" font-size="12" font-weight="800" fill="${VIZ.sub}">${label}</text>`;
    for(let i=0;i<9;i++){
      const x = 110 + i*(sw+gap);
      const isEmpty = (i===empty);
      g += `<rect x="${x}" y="${y}" width="${sw}" height="48" rx="7" fill="${isEmpty?"#fdeceb":"#dbe7fb"}" stroke="${isEmpty?"#e8552d":VIZ.blue}" stroke-width="1.6" ${isEmpty?'stroke-dasharray="5 4"':''}/>`;
      if(!isEmpty){
        g += `<circle cx="${x+sw/2}" cy="${y+18}" r="8" fill="${VIZ.blue}"/>`;
        g += `<text x="${x+sw/2}" y="${y+40}" text-anchor="middle" font-size="10" fill="${VIZ.sub}">e⁻</text>`;
      }else{
        g += `<text x="${x+sw/2}" y="${y+29}" text-anchor="middle" font-size="12" font-weight="800" fill="#e8552d">빈자리</text>`;
      }
    }
    if(arrow){
      const xe = 110 + empty*(sw+gap);
      g += `<line x1="${xe+sw+6}" y1="${y+24}" x2="${xe+sw+34}" y2="${y+24}" stroke="${VIZ.blue}" stroke-width="2.4" marker-end="url(#hsA)"/>`;
    }
    return g;
  };
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="한 줄로 앉은 사람들이 오른쪽으로 한 칸씩 옮기면 빈 좌석은 왼쪽으로 이동하는 비유">`;
  s += `<defs><marker id="hsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${VIZ.blue}"/></marker></defs>`;
  s += row(y0, 5, "처음", true);
  s += row(y1, 4, "전자 하나가 오른쪽으로 옮겨 앉으면", false);
  s += `<line x1="452" y1="${y0+56}" x2="452" y2="${y1-24}" stroke="${VIZ.axis}" stroke-width="2" marker-end="url(#hsA2)"/>`;
  s += `<defs><marker id="hsA2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${VIZ.axis}"/></marker></defs>`;
  s += `<text x="410" y="252" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e8552d">전자는 오른쪽으로 갔는데, 빈자리는 왼쪽으로 갔습니다</text>`;
  s += `<text x="410" y="274" text-anchor="middle" font-size="12" fill="${VIZ.sub}">빈자리가 스스로 움직인 것이 아니라, 전자들의 이동을 빈자리 쪽에서 본 것입니다.</text>`;
  return s+"</svg>";
}

/* 가전자대에서 전자 하나가 빠지면 무슨 일이 생기나 */
function holeBand(){
  const w=820, h=300;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="가전자대에서 전자 하나가 전도대로 올라가 정공이 생기고 둘 다 전류를 만드는 그림">`;
  s += `<text x="30" y="26" font-size="13.5" font-weight="800" fill="${VIZ.ink}">전자 하나가 올라가면 캐리어가 둘 생긴다</text>`;
  /* 전도대 */
  s += `<rect x="120" y="56" width="580" height="56" rx="6" fill="#dcebfb" stroke="${VIZ.blue}" stroke-width="1.6"/>`;
  s += `<text x="140" y="90" font-size="13" font-weight="800" fill="${VIZ.blue}">전도대</text>`;
  s += `<circle cx="420" cy="84" r="9" fill="${VIZ.blue}" stroke="#fff" stroke-width="2"/>`;
  s += `<text x="420" y="88" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">−</text>`;
  s += `<text x="452" y="88" font-size="12" font-weight="700" fill="${VIZ.blue}">자유전자</text>`;
  /* 밴드갭 */
  s += `<line x1="420" y1="188" x2="420" y2="120" stroke="#0f9d6e" stroke-width="2.2" stroke-dasharray="4 3"/>`;
  s += `<path d="M415 122 L425 122 L420 112 Z" fill="#0f9d6e"/>`;
  s += `<text x="434" y="156" font-size="12" font-weight="800" fill="#0f9d6e">열·빛으로 올라감</text>`;
  s += `<text x="140" y="156" font-size="12" font-weight="700" fill="${VIZ.muted}">밴드갭</text>`;
  /* 가전자대 */
  s += `<rect x="120" y="188" width="580" height="56" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>`;
  s += `<text x="140" y="222" font-size="13" font-weight="800" fill="#fff">가전자대</text>`;
  for(let i=0;i<9;i++){
    const x = 250 + i*46;
    if(i===4){
      s += `<circle cx="${x}" cy="216" r="9" fill="#fdeceb" stroke="#e8552d" stroke-width="2"/>`;
      s += `<text x="${x}" y="220" text-anchor="middle" font-size="10" font-weight="800" fill="#e8552d">+</text>`;
    }else{
      s += `<circle cx="${x}" cy="216" r="8" fill="#cfe0f7"/>`;
    }
  }
  s += `<text x="450" y="270" font-size="12" font-weight="700" fill="#e8552d">← 남은 빈자리 = 정공 (주변이 (+)로 남는다)</text>`;
  s += `<text x="30" y="${h-8}" font-size="11.5" fill="${VIZ.muted}">전도대의 자유전자와 가전자대의 정공, 둘 다 전류를 만듭니다. 그래서 캐리어는 항상 쌍으로 생깁니다.</text>`;
  return s+"</svg>";
}

/* ───────── 고정 자료: 다이오드는 왜 0.7V인가 ───────── */

/* 선형 스케일에서는 '무릎'처럼 보이지만 로그로 보면 직선 */
function diodeIV(){
  const w=820, h=340;
  const VT=0.02585, Is=1e-12;
  const I = v => Is*(Math.exp(v/VT)-1);
  /* 왼쪽: 선형 */
  const L={x:70,y:60,w:320,h:210};
  const R={x:470,y:60,w:290,h:210};
  const lx = v => L.x + v/0.85*L.w;
  const ly = i => L.y + L.h - Math.min(i/0.02,1)*L.h;
  const rx = v => R.x + v/0.85*R.w;
  const rly = i => { const e=Math.log10(Math.max(i,1e-13)); return R.y + R.h - (e+13)/(13-1.7)*R.h; };
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="다이오드 전류-전압 곡선을 선형 축과 로그 축으로 비교한 그림">`;
  /* 왼쪽 축 */
  s += `<text x="${L.x}" y="36" font-size="13.5" font-weight="800" fill="${VIZ.ink}">보통 그리는 그림 (세로축 = 전류)</text>`;
  s += `<line x1="${L.x}" y1="${L.y}" x2="${L.x}" y2="${L.y+L.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<line x1="${L.x}" y1="${L.y+L.h}" x2="${L.x+L.w}" y2="${L.y+L.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  let d="";
  for(let i=0;i<=200;i++){ const v=0.85*i/200, ii=I(v); if(ii>0.021) break; d+=(d?"L":"M")+lx(v).toFixed(1)+" "+ly(ii).toFixed(1); }
  s += `<path d="${d}" fill="none" stroke="${VIZ.ink}" stroke-width="2.6"/>`;
  s += `<line x1="${lx(0.7)}" y1="${L.y}" x2="${lx(0.7)}" y2="${L.y+L.h}" stroke="${VIZ.accent}" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  s += `<text x="${lx(0.7)}" y="${L.y+L.h+20}" text-anchor="middle" font-size="12" font-weight="800" fill="${VIZ.accent}">0.7 V</text>`;
  s += `<text x="${L.x+L.w/2}" y="${L.y+L.h+40}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">여기서 갑자기 꺾이는 것처럼 보인다</text>`;
  /* 오른쪽 축 */
  s += `<text x="${R.x}" y="36" font-size="13.5" font-weight="800" fill="${VIZ.ink}">세로축을 로그로 바꾸면 (전류 자릿수)</text>`;
  s += `<line x1="${R.x}" y1="${R.y}" x2="${R.x}" y2="${R.y+R.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<line x1="${R.x}" y1="${R.y+R.h}" x2="${R.x+R.w}" y2="${R.y+R.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  [[-2,"10 mA"],[-4,"0.1 mA"],[-6,"1 µA"],[-8,"10 nA"],[-10,"0.1 nA"]].forEach(([e,t])=>{
    s += `<line x1="${R.x}" y1="${rly(Math.pow(10,e))}" x2="${R.x+R.w}" y2="${rly(Math.pow(10,e))}" stroke="${VIZ.grid}" stroke-width="1"/>`;
    s += `<text x="${R.x-8}" y="${rly(Math.pow(10,e))+4}" text-anchor="end" font-size="10.5" fill="${VIZ.muted}">${t}</text>`;
  });
  let d2="";
  for(let i=0;i<=200;i++){ const v=0.85*i/200, ii=I(v); if(ii<1e-11||ii>0.05) continue; d2+=(d2?"L":"M")+rx(v).toFixed(1)+" "+rly(ii).toFixed(1); }
  s += `<path d="${d2}" fill="none" stroke="${VIZ.ink}" stroke-width="2.6"/>`;
  s += `<line x1="${rx(0.7)}" y1="${R.y}" x2="${rx(0.7)}" y2="${R.y+R.h}" stroke="${VIZ.accent}" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  s += `<text x="${rx(0.7)}" y="${R.y+R.h+20}" text-anchor="middle" font-size="12" font-weight="800" fill="${VIZ.accent}">0.7 V</text>`;
  s += `<text x="${R.x+R.w/2}" y="${R.y+R.h+40}" text-anchor="middle" font-size="11.5" fill="#e8552d">완전한 직선 — 꺾이는 곳이 없다</text>`;
  s += `<text x="410" y="${h-8}" text-anchor="middle" font-size="12" fill="${VIZ.sub}">같은 곡선입니다. 축만 바꿨을 뿐인데 '문턱'이 사라졌습니다.</text>`;
  return s+"</svg>";
}

/* 재료별 순방향 전압과 밴드갭의 순서가 같다 */
function diodeMaterials(){
  const w=820, h=300;
  const VT=0.02585;
  const mats=[
    {t:"Ge", von:0.3, Is:1e-6,  eg:"0.67 eV", c:"#0f9d6e"},
    {t:"Si", von:0.7, Is:1e-12, eg:"1.12 eV", c:VIZ.accent},
    {t:"GaAs", von:1.2, Is:1e-20, eg:"1.42 eV", c:"#e8552d"},
  ];
  const P={x:80,y:50,w:420,h:190};
  const X = v => P.x + v/1.5*P.w;
  const Y = i => P.y + P.h - Math.min(i/0.02,1)*P.h;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="게르마늄 실리콘 갈륨비소 다이오드의 순방향 전압 비교와 밴드갭 순서">`;
  s += `<line x1="${P.x}" y1="${P.y}" x2="${P.x}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<line x1="${P.x}" y1="${P.y+P.h}" x2="${P.x+P.w}" y2="${P.y+P.h}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<text x="${P.x-10}" y="${P.y+6}" text-anchor="end" font-size="11.5" font-weight="700" fill="${VIZ.sub}">전류</text>`;
  s += `<text x="${P.x+P.w}" y="${P.y+P.h+22}" text-anchor="end" font-size="11.5" font-weight="700" fill="${VIZ.sub}">순방향 전압 →</text>`;
  mats.forEach(m=>{
    let d="";
    for(let i=0;i<=240;i++){ const v=1.5*i/240, ii=m.Is*(Math.exp(v/VT)-1); if(ii>0.021) break; d+=(d?"L":"M")+X(v).toFixed(1)+" "+Y(ii).toFixed(1); }
    s += `<path d="${d}" fill="none" stroke="${m.c}" stroke-width="2.6"/>`;
    s += `<text x="${X(m.von)}" y="${P.y+P.h+20}" text-anchor="middle" font-size="12" font-weight="800" fill="${m.c}">${m.von} V</text>`;
    s += `<text x="${X(m.von)}" y="${P.y-8}" text-anchor="middle" font-size="13" font-weight="800" fill="${m.c}">${m.t}</text>`;
  });
  /* 오른쪽 밴드갭 비교 */
  s += `<text x="560" y="${P.y-8}" font-size="13" font-weight="800" fill="${VIZ.ink}">밴드갭과 순서가 같다</text>`;
  mats.forEach((m,i)=>{
    const y = P.y + 24 + i*54;
    s += `<text x="560" y="${y+16}" font-size="13" font-weight="800" fill="${m.c}">${m.t}</text>`;
    s += `<text x="612" y="${y+16}" font-size="12.5" fill="${VIZ.sub}">밴드갭 ${m.eg}</text>`;
    s += `<text x="612" y="${y+34}" font-size="12.5" fill="${VIZ.muted}">→ 켜지는 전압 ${m.von} V</text>`;
  });
  s += `<text x="410" y="${h-10}" text-anchor="middle" font-size="12" fill="${VIZ.sub}">밴드갭이 클수록 같은 전류를 흘리는 데 더 큰 전압이 필요합니다.</text>`;
  return s+"</svg>";
}

    </div>
    <p class="mat-section-note">이 둔감함은 2장에서 배우는 <b>이상적 등가회로와 실제 등가회로</b>의 근거이기도 합니다.
    다이오드를 '0.7V짜리 전지'처럼 취급해도 되는 이유가 여기 있습니다.</p>
  </div>

  <div class="card">
    <h3>🧱 재료가 바뀌면 왜 값이 바뀌나 — 밴드갭과의 연결</h3>
    <div class="chart-wrap">${diodeMaterials()}</div>
    <p class="chart-note">Ge 0.3V · Si 0.7V · GaAs 1.2V. 이 순서가 <b>밴드갭 순서와 정확히 같습니다.</b>
    밴드갭이 크면 열만으로 만들어지는 캐리어가 적어 역포화 전류가 작아지고, 그러면 같은 전류를 흘리는 데 더 큰 전압이 필요합니다.</p>
    <p class="mat-section-note">1장에서 배운 밴드갭이 2장의 회로 계산에 처음으로 직접 등장하는 지점입니다.
    <b>"Ge는 0.3, Si는 0.7"을 외우는 것이 아니라, 밴드갭이 크면 켜는 전압도 크다</b>고 이해하면 GaAs든 SiC든 처음 보는 소자의 값도 방향을 짐작할 수 있습니다.</p>
  </div>

  <div class="callout">
    <h3>🌡️ 온도가 오르면 0.7V가 아니게 됩니다</h3>
    <p>순방향 전압은 온도가 <b>1도 오를 때마다 약 2mV씩 낮아집니다.</b> 온도가 높아지면 캐리어가 많아져 같은 전류를 더 작은 전압으로 흘릴 수 있기 때문입니다.<br><br>
    이 변화가 놀랄 만큼 규칙적이어서, 거꾸로 <b>온도계</b>로 씁니다. 여러분의 CPU와 스마트폰 안에서 온도를 재는 회로 상당수가 이 원리로 동작합니다.
    "부정확한 성질"이 관점을 바꾸면 "정밀한 센서"가 되는 셈입니다.<br><br>
    반대로 증폭기 설계에서는 이것이 골칫거리입니다. 온도가 변하면 동작점이 흔들리기 때문이죠.
    <b>4장에서 배우는 바이어싱 안정화</b>가 바로 이 문제와 싸우는 내용입니다.</p>
  </div>

  <div class="hist">
    <h4>📜 교과서에 없는 이야기 — 원리를 모른 채 20년을 썼다</h4>
    <p>정류라는 현상이 처음 관찰된 것은 <b>1874년</b>입니다. 독일의 페르디난트 브라운이 광석에 금속 침을 대면 한쪽 방향으로만 전류가 잘 흐른다는 것을 발견했습니다.
    그런데 <b>왜 그런지는 아무도 몰랐습니다.</b> 양자역학도, 밴드 이론도, 심지어 전자의 발견(1897년)조차 아직이었으니까요.</p>
    <p>그런데도 이 소자는 팔려 나갔습니다. 1900~1920년대 라디오 초창기에 <b>'고양이 수염(cat's whisker) 검파기'</b>라 불린 광석 검파기가 널리 쓰였습니다.
    사용자는 가느다란 금속 침을 광석 위에서 <b>이리저리 옮겨 가며 잘 들리는 지점을 손으로 찾아야</b> 했습니다.
    같은 광석이라도 어디를 짚느냐에 따라 되기도 하고 안 되기도 했지만, 왜 그런지 설명할 수 있는 사람은 없었습니다.
    작동 원리를 모르니 개선할 방법도 없었고, 결국 진공관에 자리를 내주고 밀려납니다.</p>
    <p>설명이 붙은 것은 그로부터 한참 뒤입니다. <b>1949년</b> 윌리엄 쇼클리가 pn 접합 이론을 정리하며
    전류와 전압이 지수 관계를 갖는다는 식을 내놓았습니다. 여러분이 지금 배우는 다이오드 방정식이 그것입니다.
    브라운의 관찰로부터 <b>75년</b>이 걸린 셈입니다.</p>
    <p>이 이야기에는 공학도가 새겨둘 만한 대목이 있습니다. <b>원리를 몰라도 쓸 수는 있지만, 원리를 알아야 설계할 수 있습니다.</b>
    광석 검파기는 침을 옮겨 가며 운 좋은 지점을 찾는 물건이었지만, 방정식이 생기고 나서는 원하는 특성을 <b>계산해서 만들 수 있는</b> 소자가 되었습니다.
    0.7V가 어디서 왔는지 묻는 이 페이지의 질문도 결국 같은 종류의 질문입니다.</p>
  </div>

  <div class="card">
    <h3>📝 확인 문제</h3>

      <div class="quiz-item">
