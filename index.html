<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26년 배원규 교수 전자공학 학습자료실</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --sidebar:#101828; --sidebar-2:#1b2537;
    --ink:#1f2733; --muted:#66707f; --line:#e6e9f0;
    --accent:#2f6bff; --accent-soft:#eaf0ff; --accent-ink:#1c49c2;
    --green:#0f9d6e; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); display:flex; overflow:hidden;
  }

  /* ───────── 왼쪽 네비게이션 ───────── */
  #sidebar{
    width:280px; min-width:280px; height:100vh; overflow-y:auto;
    background:var(--sidebar); color:#e8ecf4; display:flex; flex-direction:column;
  }
  .brand{padding:26px 22px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
  .brand h1{font-size:19px; font-weight:800; letter-spacing:-.3px;}
  .brand p{font-size:12px; color:#93a0b4; margin-top:6px; line-height:1.5;}
  .nav-label{
    font-size:11px; font-weight:700; letter-spacing:.12em; color:#7d8aa0;
    padding:20px 22px 8px; text-transform:uppercase;
  }
  .nav-item{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:11px 18px; margin:2px 8px; width:calc(100% - 16px);
    border:0; background:transparent; color:#cfd7e4; text-align:left;
    font-size:14px; border-radius:10px; cursor:pointer; font-family:inherit;
    transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.07);}
  .nav-item.active{background:var(--accent); color:#fff; font-weight:700;}
  .chip{
    min-width:34px; height:24px; border-radius:7px; background:rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; letter-spacing:.02em;
  }
  .nav-item.active .chip{background:rgba(255,255,255,.25);}
  .nav-item .t{flex:1; line-height:1.3;}
  .nav-item .t small{display:block; font-size:11px; color:#8b97ab; font-weight:400; margin-top:2px;}
  .nav-item.active .t small{color:#dbe4ff;}
  .nav-item .del{
    opacity:0; border:0; background:transparent; color:inherit; cursor:pointer;
    font-size:14px; padding:2px 6px; border-radius:6px;
  }
  .nav-item:hover .del{opacity:.7;} .nav-item .del:hover{opacity:1; background:rgba(255,255,255,.15);}
  #addPageBtn{
    margin:10px 16px 24px; padding:12px; border-radius:10px; cursor:pointer;
    border:1.5px dashed rgba(255,255,255,.3); background:transparent; color:#aeb9cc;
    font-size:13.5px; font-weight:600; font-family:inherit; transition:.15s;
  }
  #addPageBtn:hover{border-color:var(--accent); color:#fff; background:rgba(47,107,255,.15);}
  .sidebar-foot{margin-top:auto; padding:16px 22px; font-size:11px; color:#5d6b81; border-top:1px solid rgba(255,255,255,.06);}

  /* ───────── 본문 ───────── */
  #main{flex:1; height:100vh; overflow-y:auto; padding:36px 44px;}
  .view{max-width:900px; margin:0 auto;}

  .ch-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .ch-eyebrow{
    display:inline-block; background:var(--accent-soft); color:var(--accent-ink);
    font-size:12px; font-weight:800; letter-spacing:.08em; padding:5px 12px; border-radius:999px;
  }
  .ch-title{font-size:30px; font-weight:800; letter-spacing:-.5px; margin-top:12px;}
  .ch-sub{color:var(--muted); font-size:15px; margin-top:6px;}
  .meta{color:var(--muted); font-size:13px; margin-top:10px;}

  .dl-btn{
    display:inline-flex; align-items:center; gap:9px; margin-top:14px;
    background:var(--accent); color:#fff; text-decoration:none;
    padding:13px 22px; border-radius:11px; font-size:15px; font-weight:700;
    box-shadow:0 6px 16px rgba(47,107,255,.28); transition:.15s;
  }
  .dl-btn:hover{transform:translateY(-1px); box-shadow:0 9px 20px rgba(47,107,255,.35);}
  .dl-btn svg{width:18px; height:18px;}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px 26px; margin-top:22px;
  }
  .card h3{font-size:15px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .obj-list{list-style:none;}
  .obj-list li{
    position:relative; padding:7px 0 7px 26px; font-size:14.5px; line-height:1.6; color:#39424f;
  }
  .obj-list li::before{content:"✓"; position:absolute; left:2px; color:var(--green); font-weight:800;}

  .pdf-frame{width:100%; height:640px; border:1px solid var(--line); border-radius:12px; margin-top:22px; background:#fff;}

  /* ───────── 커스텀 페이지(추가하기) ───────── */
  .page-title-input{
    width:100%; border:0; background:transparent; font-family:inherit;
    font-size:30px; font-weight:800; letter-spacing:-.5px; color:var(--ink); outline:none;
  }
  .page-title-input::placeholder{color:#c1c8d4;}
  .hint{color:var(--muted); font-size:13px; margin-top:8px;}
  .add-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .add-row input{
    flex:1; min-width:200px; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; font-family:inherit; outline:none; background:#fbfcfe;
  }
  .add-row input:focus{border-color:var(--accent);}
  .btn{
    padding:11px 18px; border-radius:10px; border:0; cursor:pointer; font-family:inherit;
    font-size:14px; font-weight:700; background:var(--accent); color:#fff;
  }
  .btn.ghost{background:var(--accent-soft); color:var(--accent-ink);}
  .btn.danger{background:#fdecec; color:#c0392b;}
  .yt-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px;}
  .yt-item iframe{width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:#000;}
  .yt-item .yt-cap{display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:13px; color:var(--muted);}
  .link-list{list-style:none;}
  .link-list li{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .link-list li:last-child{border-bottom:0;}
  .link-list a{color:var(--accent-ink); text-decoration:none; font-weight:600; word-break:break-all;}
  .link-list a:hover{text-decoration:underline;}
  .mini-del{border:0; background:transparent; color:#aab2bf; cursor:pointer; font-size:15px; margin-left:auto; padding:2px 8px; border-radius:6px;}
  .mini-del:hover{background:#fdecec; color:#c0392b;}
  textarea.memo{
    width:100%; min-height:140px; border:1px solid var(--line); border-radius:10px;
    padding:14px; font-family:inherit; font-size:14.5px; line-height:1.7; outline:none; resize:vertical; background:#fbfcfe;
  }
  textarea.memo:focus{border-color:var(--accent);}
  .empty{color:#aab2bf; font-size:13.5px; padding:8px 2px;}
  .page-actions{margin-top:26px; display:flex; gap:10px;}

  /* ───────── 공지사항 ───────── */
  .notice-badge{
    min-width:20px; height:20px; padding:0 6px; border-radius:999px;
    background:#ff5d5d; color:#fff; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-left:auto;
  }
  .notice-form input{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:14.5px; font-weight:700; font-family:inherit; outline:none; background:#fbfcfe; margin-bottom:10px;
  }
  .notice-form input:focus, .notice-form textarea:focus{border-color:var(--accent);}
  .notice-form textarea{
    width:100%; min-height:96px; border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-family:inherit; font-size:14.5px; line-height:1.7; outline:none; resize:vertical; background:#fbfcfe;
  }
  .notice-form .form-foot{display:flex; justify-content:flex-end; margin-top:10px;}
  .notice-item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 24px; margin-top:14px;
  }
  .notice-item.pinned{border-left:4px solid var(--accent);}
  .notice-head{display:flex; align-items:baseline; gap:10px;}
  .notice-head h4{font-size:16.5px; font-weight:800; flex:1; line-height:1.4;}
  .notice-date{font-size:12.5px; color:var(--muted); white-space:nowrap;}
  .notice-body{margin-top:10px; font-size:14.5px; line-height:1.75; color:#39424f; white-space:pre-wrap;}

  @media (max-width:820px){
    body{flex-direction:column; overflow:auto;}
    #sidebar{width:100%; min-width:0; height:auto; max-height:45vh;}
    #main{height:auto; padding:24px 18px;}
  }
</style>
</head>
<body>

<nav id="sidebar">
  <div class="brand">
    <h1>⚡ 26년 배원규 교수<br>전자공학 학습자료실</h1>
    <p>Electronic Devices &amp; Circuit Theory<br>강의자료 · 챕터별 PDF 다운로드</p>
  </div>

  <div class="nav-label">공지</div>
  <div id="noticeNav"></div>

  <div class="nav-label">Chapters</div>
  <div id="chapterNav"></div>

  <div class="nav-label">추가 자료 페이지</div>
  <div id="customNav"></div>
  <button id="addPageBtn">＋ 추가하기 — 새 자료 페이지</button>

  <div class="sidebar-foot">BAE LAB · 학습보조 페이지</div>
</nav>

<main id="main"><div class="view" id="view"></div></main>

<script>
/* ───────── 데이터 ───────── */
const CHAPTERS = [
  {n:1, ko:"반도체 다이오드", en:"Semiconductor Diodes", pages:54, file:"pdfs/chapter1.pdf",
   objs:["Si·Ge·GaAs 반도체 재료의 일반적 특성 이해","전자·정공 이론에 의한 전도 메커니즘",
         "n형·p형 반도체의 차이","무바이어스·순방향·역방향 다이오드 동작과 특성",
         "다이오드의 DC·AC·평균 AC 저항 계산","이상·실제 등가회로의 활용","제너 다이오드와 LED의 동작·특성"]},
  {n:2, ko:"다이오드 응용", en:"Diode Applications", pages:74, file:"pdfs/chapter2.pdf",
   objs:["부하선 해석(load-line analysis)과 다이오드 회로 적용","직렬·병렬·직병렬 다이오드 회로의 등가회로 해석",
         "정류(rectification) 과정 — AC 입력에서 DC 레벨 얻기","클리퍼·클램퍼 회로의 출력 응답 예측","제너 다이오드 해석과 응용 범위"]},
  {n:3, ko:"쌍극 접합 트랜지스터", en:"Bipolar Junction Transistors", pages:31, file:"pdfs/chapter3.pdf",
   objs:["BJT의 기본 구조와 동작 원리","활성 영역 동작을 위한 올바른 바이어싱",
         "npn·pnp 트랜지스터 특성의 이해와 설명","트랜지스터 응답을 결정하는 주요 파라미터","트랜지스터 테스트와 3단자 식별"]},
  {n:4, ko:"BJT의 DC 바이어싱", en:"DC Biasing — BJTs", pages:93, file:"pdfs/chapter4.pdf",
   objs:["주요 BJT 회로 구성의 DC 레벨 결정","BJT 회로의 전압 측정과 정상 동작 판별",
         "포화·차단 조건과 각 조건의 전압·전류 레벨","대표적 BJT 구성의 부하선 해석","BJT 증폭기 설계 과정",
         "트랜지스터 스위칭 회로의 기본 동작","BJT 회로의 고장 진단(troubleshooting)","안정도 계수(stability factor)와 환경 변화의 영향"]},
  {n:5, ko:"BJT 교류 해석", en:"BJT AC Analysis", pages:125, file:"pdfs/chapter5.pdf",
   objs:["BJT의 rₑ·하이브리드·하이브리드 π 모델","등가 모델을 이용한 증폭기 AC 파라미터 계산",
         "소스 저항·부하 저항이 전체 이득에 미치는 영향","주요 BJT 구성의 일반적인 AC 특성",
         "단일단·다단 증폭기의 2포트 시스템 접근","AC 증폭기 회로의 고장 진단"]},
];

const LS_KEY = "elec-custom-pages-v1";
function loadPages(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||[];}catch(e){return [];} }
function savePages(p){ try{localStorage.setItem(LS_KEY, JSON.stringify(p));}catch(e){} }
let customPages = loadPages();

const LS_NOTICE = "elec-notices-v1";
function loadNotices(){ try{return JSON.parse(localStorage.getItem(LS_NOTICE))||[];}catch(e){return [];} }
function saveNotices(n){ try{localStorage.setItem(LS_NOTICE, JSON.stringify(n));}catch(e){} }
let notices = loadNotices();

let current = {type:"chapter", id:1};

/* ───────── 네비게이션 렌더 ───────── */
function renderNav(){
  const nNav = document.getElementById("noticeNav");
  nNav.innerHTML = "";
  const nb = document.createElement("button");
  nb.className = "nav-item" + (current.type==="notice" ? " active":"");
  nb.innerHTML = `<span class="chip">📢</span><span class="t">공지사항<small>Notice</small></span>` +
    (notices.length ? `<span class="notice-badge">${notices.length}</span>` : "");
  nb.onclick = ()=>{ current={type:"notice"}; render(); };
  nNav.appendChild(nb);

  const chNav = document.getElementById("chapterNav");
  chNav.innerHTML = "";
  CHAPTERS.forEach(c=>{
    const b = document.createElement("button");
    b.className = "nav-item" + (current.type==="chapter"&&current.id===c.n ? " active":"");
    b.innerHTML = `<span class="chip">Ch.${c.n}</span><span class="t">${c.ko}<small>${c.en}</small></span>`;
    b.onclick = ()=>{ current={type:"chapter",id:c.n}; render(); };
    chNav.appendChild(b);
  });
  const cNav = document.getElementById("customNav");
  cNav.innerHTML = "";
  if(!customPages.length){
    cNav.innerHTML = `<div class="empty" style="padding:4px 22px 6px;">아직 없음 — 아래 버튼으로 추가</div>`;
  }
  customPages.forEach(p=>{
    const b = document.createElement("button");
    b.className = "nav-item" + (current.type==="custom"&&current.id===p.id ? " active":"");
    b.innerHTML = `<span class="chip">📎</span><span class="t">${esc(p.title)||"제목 없는 페이지"}</span><span class="del" title="페이지 삭제">✕</span>`;
    b.onclick = ()=>{ current={type:"custom",id:p.id}; render(); };
    b.querySelector(".del").onclick = (e)=>{ e.stopPropagation(); deletePage(p.id); };
    cNav.appendChild(b);
  });
}

/* ───────── 챕터 뷰 ───────── */
function renderChapter(c){
  return `
  <div class="ch-head">
    <div>
      <span class="ch-eyebrow">CHAPTER ${c.n}</span>
      <h2 class="ch-title">${c.ko}</h2>
      <p class="ch-sub">${c.en}</p>
      <p class="meta">📄 강의자료 PDF · ${c.pages}쪽</p>
      <a class="dl-btn" href="${c.file}" download="전자공학-챕터${c.n}.pdf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        PDF 다운로드
      </a>
    </div>
  </div>
  <div class="card">
    <h3>🎯 학습 목표</h3>
    <ul class="obj-list">${c.objs.map(o=>`<li>${o}</li>`).join("")}</ul>
  </div>
  <iframe class="pdf-frame" src="${c.file}" title="Chapter ${c.n} 미리보기"></iframe>`;
}

/* ───────── 커스텀 페이지 뷰 ───────── */
function renderCustom(p){
  return `
  <input class="page-title-input" id="pgTitle" value="${esc(p.title)}" placeholder="페이지 제목을 입력하세요">
  <p class="hint">이 페이지에 유튜브 영상, 읽을거리 링크, 메모를 자유롭게 추가하세요. (변경 사항은 자동 저장)</p>

  <div class="card">
    <h3>▶️ 유튜브 자료</h3>
    <div class="add-row">
      <input id="ytUrl" placeholder="유튜브 링크 붙여넣기 (예: https://youtu.be/...)">
      <button class="btn" id="ytAdd">영상 추가</button>
    </div>
    <div class="yt-grid" id="ytGrid">
      ${p.videos.length ? p.videos.map((v,i)=>`
        <div class="yt-item">
          <iframe src="https://www.youtube.com/embed/${esc(v.id)}" allowfullscreen></iframe>
          <div class="yt-cap"><span>${esc(v.url)}</span><button class="mini-del" data-del-yt="${i}">✕</button></div>
        </div>`).join("") : `<div class="empty">등록된 영상이 없습니다.</div>`}
    </div>
  </div>

  <div class="card">
    <h3>📚 읽을거리</h3>
    <div class="add-row">
      <input id="rdTitle" placeholder="자료 제목" style="flex:0.8;">
      <input id="rdUrl" placeholder="링크 (https://...)">
      <button class="btn" id="rdAdd">추가</button>
    </div>
    <ul class="link-list" id="rdList">
      ${p.readings.length ? p.readings.map((r,i)=>`
        <li>🔗 <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)||esc(r.url)}</a>
        <button class="mini-del" data-del-rd="${i}">✕</button></li>`).join("") : `<div class="empty">등록된 읽을거리가 없습니다.</div>`}
    </ul>
  </div>

  <div class="card">
    <h3>📝 메모</h3>
    <textarea class="memo" id="pgMemo" placeholder="수업 공지, 과제 안내, 보충 설명 등을 적어두세요.">${esc(p.memo)}</textarea>
  </div>

  <div class="page-actions">
    <button class="btn danger" id="pgDelete">페이지 삭제</button>
  </div>`;
}

function bindCustom(p){
  const upd = ()=>{ savePages(customPages); renderNav(); };
  document.getElementById("pgTitle").oninput = e=>{ p.title = e.target.value; upd(); };
  document.getElementById("pgMemo").oninput = e=>{ p.memo = e.target.value; savePages(customPages); };
  document.getElementById("pgDelete").onclick = ()=> deletePage(p.id);

  document.getElementById("ytAdd").onclick = ()=>{
    const url = document.getElementById("ytUrl").value.trim();
    const id = ytId(url);
    if(!id){ alert("유효한 유튜브 링크가 아닙니다."); return; }
    p.videos.push({url, id}); savePages(customPages); render();
  };
  document.getElementById("rdAdd").onclick = ()=>{
    const t = document.getElementById("rdTitle").value.trim();
    const u = document.getElementById("rdUrl").value.trim();
    if(!u){ alert("링크를 입력하세요."); return; }
    p.readings.push({title:t, url:u.startsWith("http")?u:"https://"+u}); savePages(customPages); render();
  };
  document.querySelectorAll("[data-del-yt]").forEach(b=> b.onclick = ()=>{ p.videos.splice(+b.dataset.delYt,1); savePages(customPages); render(); });
  document.querySelectorAll("[data-del-rd]").forEach(b=> b.onclick = ()=>{ p.readings.splice(+b.dataset.delRd,1); savePages(customPages); render(); });
}

/* ───────── 공지사항 뷰 ───────── */
function renderNotice(){
  return `
  <span class="ch-eyebrow">NOTICE</span>
  <h2 class="ch-title">📢 공지사항</h2>
  <p class="ch-sub">수업 공지, 과제 마감, 시험 일정 등을 확인하세요.</p>

  <div class="card notice-form">
    <h3>＋ 공지 추가하기</h3>
    <input id="ntTitle" placeholder="공지 제목 (예: 중간고사 범위 안내)">
    <textarea id="ntBody" placeholder="공지 내용을 입력하세요."></textarea>
    <div class="form-foot"><button class="btn" id="ntAdd">공지 등록</button></div>
  </div>

  <div id="noticeList">
    ${notices.length ? notices.map((n,i)=>`
      <div class="notice-item${i===0?" pinned":""}">
        <div class="notice-head">
          <h4>${esc(n.title)}</h4>
          <span class="notice-date">${esc(n.date)}</span>
          <button class="mini-del" data-del-nt="${i}" title="공지 삭제">✕</button>
        </div>
        ${n.body ? `<div class="notice-body">${esc(n.body)}</div>` : ""}
      </div>`).join("") : `<div class="empty" style="margin-top:18px;">등록된 공지가 없습니다. 위에서 첫 공지를 추가해보세요.</div>`}
  </div>`;
}

function bindNotice(){
  document.getElementById("ntAdd").onclick = ()=>{
    const t = document.getElementById("ntTitle").value.trim();
    const b = document.getElementById("ntBody").value.trim();
    if(!t){ alert("공지 제목을 입력하세요."); return; }
    const d = new Date();
    const date = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
    notices.unshift({id:Date.now(), title:t, body:b, date});
    saveNotices(notices); render();
  };
  document.querySelectorAll("[data-del-nt]").forEach(btn=> btn.onclick = ()=>{
    if(!confirm("이 공지를 삭제할까요?")) return;
    notices.splice(+btn.dataset.delNt,1); saveNotices(notices); render();
  });
}

/* ───────── 공통 ───────── */
function render(){
  renderNav();
  const view = document.getElementById("view");
  if(current.type==="notice"){
    view.innerHTML = renderNotice();
    bindNotice();
  }else if(current.type==="chapter"){
    const c = CHAPTERS.find(x=>x.n===current.id) || CHAPTERS[0];
    view.innerHTML = renderChapter(c);
  }else{
    const p = customPages.find(x=>x.id===current.id);
    if(!p){ current={type:"chapter",id:1}; return render(); }
    view.innerHTML = renderCustom(p);
    bindCustom(p);
  }
  document.getElementById("main").scrollTop = 0;
}

document.getElementById("addPageBtn").onclick = ()=>{
  const p = {id:Date.now(), title:"", videos:[], readings:[], memo:""};
  customPages.push(p); savePages(customPages);
  current = {type:"custom", id:p.id};
  render();
  const t = document.getElementById("pgTitle"); if(t) t.focus();
};

function deletePage(id){
  if(!confirm("이 페이지를 삭제할까요? 되돌릴 수 없습니다.")) return;
  customPages = customPages.filter(x=>x.id!==id);
  savePages(customPages);
  if(current.type==="custom"&&current.id===id) current={type:"chapter",id:1};
  render();
}

function ytId(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,20})/);
  return m ? m[1] : null;
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

render();
</script>
</body>
</html>
