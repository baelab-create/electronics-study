<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26년 배원규 교수 전자공학 학습자료실</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --sidebar:#101828; --sidebar-2:#1b2537;
    --ink:#1f2733; --muted:#66707f; --line:#e6e9f0;
    --accent:#2f6bff; --accent-soft:#eaf0ff; --accent-ink:#1c49c2;
    --green:#0f9d6e; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); display:flex; overflow:hidden;
  }

  /* ───────── 왼쪽 네비게이션 ───────── */
  #sidebar{
    width:280px; min-width:280px; height:100vh; overflow-y:auto;
    background:var(--sidebar); color:#e8ecf4; display:flex; flex-direction:column;
  }
  .brand{padding:26px 22px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
  .brand h1{font-size:19px; font-weight:800; letter-spacing:-.3px;}
  .brand p{font-size:12px; color:#93a0b4; margin-top:6px; line-height:1.5;}
  .nav-label{
    font-size:11px; font-weight:700; letter-spacing:.12em; color:#7d8aa0;
    padding:20px 22px 8px; text-transform:uppercase;
  }
  .nav-item{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:11px 18px; margin:2px 8px; width:calc(100% - 16px);
    border:0; background:transparent; color:#cfd7e4; text-align:left;
    font-size:14px; border-radius:10px; cursor:pointer; font-family:inherit;
    transition:background .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.07);}
  .nav-item.active{background:var(--accent); color:#fff; font-weight:700;}
  .chip{
    min-width:34px; height:24px; border-radius:7px; background:rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; letter-spacing:.02em;
  }
  .nav-item.active .chip{background:rgba(255,255,255,.25);}
  .nav-item .t{flex:1; line-height:1.3;}
  .nav-item .t small{display:block; font-size:11px; color:#8b97ab; font-weight:400; margin-top:2px;}
  .nav-item.active .t small{color:#dbe4ff;}
  .nav-item .del{
    opacity:0; border:0; background:transparent; color:inherit; cursor:pointer;
    font-size:14px; padding:2px 6px; border-radius:6px;
  }
  .nav-item:hover .del{opacity:.7;} .nav-item .del:hover{opacity:1; background:rgba(255,255,255,.15);}
  #addPageBtn{
    margin:10px 16px 24px; padding:12px; border-radius:10px; cursor:pointer;
    border:1.5px dashed rgba(255,255,255,.3); background:transparent; color:#aeb9cc;
    font-size:13.5px; font-weight:600; font-family:inherit; transition:.15s;
  }
  #addPageBtn:hover{border-color:var(--accent); color:#fff; background:rgba(47,107,255,.15);}
  .sidebar-foot{margin-top:auto; padding:16px 22px; font-size:11px; color:#5d6b81; border-top:1px solid rgba(255,255,255,.06);}

  /* ───────── 본문 ───────── */
  #main{flex:1; height:100vh; overflow-y:auto; padding:36px 44px;}
  .view{max-width:900px; margin:0 auto;}

  .ch-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .ch-eyebrow{
    display:inline-block; background:var(--accent-soft); color:var(--accent-ink);
    font-size:12px; font-weight:800; letter-spacing:.08em; padding:5px 12px; border-radius:999px;
  }
  .ch-title{font-size:30px; font-weight:800; letter-spacing:-.5px; margin-top:12px;}
  .ch-sub{color:var(--muted); font-size:15px; margin-top:6px;}
  .meta{color:var(--muted); font-size:13px; margin-top:10px;}

  .dl-btn{
    display:inline-flex; align-items:center; gap:9px; margin-top:14px;
    background:var(--accent); color:#fff; text-decoration:none;
    padding:13px 22px; border-radius:11px; font-size:15px; font-weight:700;
    box-shadow:0 6px 16px rgba(47,107,255,.28); transition:.15s;
  }
  .dl-btn:hover{transform:translateY(-1px); box-shadow:0 9px 20px rgba(47,107,255,.35);}
  .dl-btn svg{width:18px; height:18px;}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px 26px; margin-top:22px;
  }
  .card h3{font-size:15px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .obj-list{list-style:none;}
  .obj-list li{
    position:relative; padding:7px 0 7px 26px; font-size:14.5px; line-height:1.6; color:#39424f;
  }
  .obj-list li::before{content:"✓"; position:absolute; left:2px; color:var(--green); font-weight:800;}

  .pdf-frame{width:100%; height:640px; border:1px solid var(--line); border-radius:12px; margin-top:22px; background:#fff;}

  /* ───────── 커스텀 페이지(추가하기) ───────── */
  .page-title-input{
    width:100%; border:0; background:transparent; font-family:inherit;
    font-size:30px; font-weight:800; letter-spacing:-.5px; color:var(--ink); outline:none;
  }
  .page-title-input::placeholder{color:#c1c8d4;}
  .hint{color:var(--muted); font-size:13px; margin-top:8px;}
  .add-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .add-row input{
    flex:1; min-width:200px; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; font-family:inherit; outline:none; background:#fbfcfe;
  }
  .add-row input:focus{border-color:var(--accent);}
  .btn{
    padding:11px 18px; border-radius:10px; border:0; cursor:pointer; font-family:inherit;
    font-size:14px; font-weight:700; background:var(--accent); color:#fff;
  }
  .btn.ghost{background:var(--accent-soft); color:var(--accent-ink);}
  .btn.danger{background:#fdecec; color:#c0392b;}
  .yt-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px;}
  .yt-item iframe{width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:#000;}
  .yt-item .yt-cap{display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:13px; color:var(--muted);}
  .link-list{list-style:none;}
  .link-list li{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .link-list li:last-child{border-bottom:0;}
  .link-list a{color:var(--accent-ink); text-decoration:none; font-weight:600; word-break:break-all;}
  .link-list a:hover{text-decoration:underline;}
  .mini-del{border:0; background:transparent; color:#aab2bf; cursor:pointer; font-size:15px; margin-left:auto; padding:2px 8px; border-radius:6px;}
  .mini-del:hover{background:#fdecec; color:#c0392b;}
  textarea.memo{
    width:100%; min-height:140px; border:1px solid var(--line); border-radius:10px;
    padding:14px; font-family:inherit; font-size:14.5px; line-height:1.7; outline:none; resize:vertical; background:#fbfcfe;
  }
  textarea.memo:focus{border-color:var(--accent);}
  .empty{color:#aab2bf; font-size:13.5px; padding:8px 2px;}
  .page-actions{margin-top:26px; display:flex; gap:10px;}

  /* ───────── 공지사항 ───────── */
  .notice-badge{
    min-width:20px; height:20px; padding:0 6px; border-radius:999px;
    background:#ff5d5d; color:#fff; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-left:auto;
  }
  .notice-form input{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:14.5px; font-weight:700; font-family:inherit; outline:none; background:#fbfcfe; margin-bottom:10px;
  }
  .notice-form input:focus, .notice-form textarea:focus{border-color:var(--accent);}
  .notice-form textarea{
    width:100%; min-height:96px; border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-family:inherit; font-size:14.5px; line-height:1.7; outline:none; resize:vertical; background:#fbfcfe;
  }
  .notice-form .form-foot{display:flex; justify-content:flex-end; margin-top:10px;}
  .notice-item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 24px; margin-top:14px;
  }
  .notice-item.pinned{border-left:4px solid var(--accent);}
  .notice-head{display:flex; align-items:baseline; gap:10px;}
  .notice-head h4{font-size:16.5px; font-weight:800; flex:1; line-height:1.4;}
  .notice-date{font-size:12.5px; color:var(--muted); white-space:nowrap;}
  .notice-body{margin-top:10px; font-size:14.5px; line-height:1.75; color:#39424f; white-space:pre-wrap;}

  /* ───────── 고정 자료 페이지 (반도체 발전사) ───────── */
  .era-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin-top:18px;}
  .era-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
  .era-year{display:inline-block; background:var(--accent-soft); color:var(--accent-ink); font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px;}
  .era-card h4{font-size:15.5px; font-weight:800; margin-top:10px;}
  .era-card p{font-size:13.5px; line-height:1.65; color:#4a5462; margin-top:6px;}
  .era-card.hl{border:1.5px solid var(--accent); box-shadow:0 4px 14px rgba(47,107,255,.12);}
  .chart-wrap{margin-top:16px;}
  .chart-wrap svg{width:100%; height:auto; display:block;}
  .chart-note{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.6;}
  .callout{
    background:#fff8e8; border:1px solid #f2dfae; border-radius:var(--radius);
    padding:20px 24px; margin-top:22px;
  }
  .callout h3{font-size:15px; font-weight:800; margin-bottom:10px;}
  .callout p{font-size:14px; line-height:1.75; color:#4a4636;}
  .mat-table-wrap{overflow-x:auto; margin-top:14px;}
  .mat-table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px;}
  .mat-table th{
    text-align:left; padding:10px 12px; background:#f2f5fb;
    color:#435063; font-weight:800; border-bottom:2px solid var(--line); white-space:nowrap;
  }
  .mat-table td{padding:10px 12px; border-bottom:1px solid var(--line); line-height:1.55; vertical-align:top;}
  .mat-table td:first-child{font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .mat-table tr.hl-row td{background:#eef3ff;}
  .mat-section-note{font-size:13px; color:var(--muted); margin-top:14px; line-height:1.7;}

  /* ───────── 고정 자료 페이지 (전기는 흐르지 않는다) ───────── */
  .fact-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px;}
  .fact-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px 20px;}
  .fact-card.myth{background:#fff6f5; border-color:#f2d6d2;}
  .fact-card.truth{background:#f1f6ff; border-color:#cfdefa;}
  .fact-tag{display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.06em; padding:4px 10px; border-radius:999px;}
  .fact-card.myth .fact-tag{background:#fadedb; color:#a3423c;}
  .fact-card.truth .fact-tag{background:#dbe7ff; color:#25519e;}
  .fact-card p{font-size:13.8px; line-height:1.72; color:#3f4855; margin-top:9px;}
  .calc{
    background:#f7f9fc; border:1px solid var(--line); border-radius:12px;
    padding:16px 20px; margin-top:16px; font-size:14px; line-height:1.85; color:#3f4855;
  }
  .calc .eq{display:block; font-size:16px; font-weight:800; color:var(--ink); margin-bottom:8px; letter-spacing:.01em;}
  .calc .num{font-variant-numeric:tabular-nums; font-weight:700; color:var(--accent-ink);}
  .calc-note{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.6;}
  .link-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-top:16px;}
  .link-card{
    display:block; border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    background:var(--panel); text-decoration:none; color:inherit; transition:.15s;
  }
  .link-card:hover{border-color:var(--accent); box-shadow:0 4px 14px rgba(47,107,255,.12);}
  .link-card b{display:block; font-size:14px; font-weight:800;}
  .link-card span{display:block; font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.55;}
  @media (max-width:820px){ .fact-grid{grid-template-columns:1fr;} }

  /* ───────── 고정 자료 페이지 (원자모델) ───────── */
  .atom-list{list-style:none; margin-top:18px; counter-reset:am;}
  .atom-list li{
    counter-increment:am; position:relative; padding:12px 0 12px 44px;
    border-bottom:1px solid var(--line); font-size:14.5px; line-height:1.72; color:#39424f;
  }
  .atom-list li:last-child{border-bottom:0;}
  .atom-list li::before{
    content:counter(am); position:absolute; left:0; top:13px;
    width:25px; height:25px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent-ink); font-size:12.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .am-tag{
    display:inline-block; background:#eef2f7; color:#4a5462; font-size:11.5px; font-weight:800;
    padding:3px 9px; border-radius:999px; margin-right:8px; vertical-align:1px;
  }
  .am-key{color:var(--accent-ink); font-weight:800;}

  /* ───────── 레이저 포인터 ───────── */
  #laserBtn{
    position:fixed; right:22px; bottom:22px; z-index:1000;
    display:flex; align-items:center; gap:8px;
    padding:11px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-family:inherit;
    font-size:13.5px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 14px rgba(16,24,40,.14); transition:.15s;
  }
  #laserBtn:hover{transform:translateY(-1px);}
  #laserBtn .dot{width:10px; height:10px; border-radius:50%; background:#e34948;}
  #laserBtn.on{background:#e34948; border-color:#e34948; color:#fff;}
  #laserBtn.on .dot{background:#fff; box-shadow:0 0 8px 2px rgba(255,255,255,.8);}
  body.laser-on, body.laser-on *{cursor:none !important;}
  .laser-dot{
    position:fixed; left:0; top:0; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle, #ffd9d9 0%, #ff4b4b 40%, #d40000 100%);
    box-shadow:0 0 14px 5px rgba(255,45,45,.55);
    pointer-events:none; z-index:2000; transform:translate(-50%,-50%);
  }
  #laserCanvas{position:fixed; left:0; top:0; width:100vw; height:100vh; pointer-events:none; z-index:1999;}

  @media (max-width:820px){
    body{flex-direction:column; overflow:auto;}
    #sidebar{width:100%; min-width:0; height:auto; max-height:45vh;}
    #main{height:auto; padding:24px 18px;}
  }
</style>
</head>
<body>

<nav id="sidebar">
  <div class="brand">
    <h1>⚡ 26년 배원규 교수<br>전자공학 학습자료실</h1>
    <p>Electronic Devices &amp; Circuit Theory<br>강의자료 · 챕터별 PDF 다운로드</p>
  </div>

  <div class="nav-label">공지</div>
  <div id="noticeNav"></div>

  <div class="nav-label">Chapters</div>
  <div id="chapterNav"></div>

  <div class="nav-label">추가 자료 페이지</div>
  <div id="customNav"></div>
  <button id="addPageBtn">＋ 추가하기 — 새 자료 페이지</button>

  <div class="sidebar-foot">BAE LAB · 학습보조 페이지</div>
</nav>

<main id="main"><div class="view" id="view"></div></main>

<button id="laserBtn" title="단축키: L 또는 Esc로 끄기"><span class="dot"></span>레이저 포인터</button>

<script>
/* ───────── 데이터 ───────── */
const CHAPTERS = [
  {n:1, ko:"반도체 다이오드", en:"Semiconductor Diodes", pages:54, file:"pdfs/chapter1.pdf",
   objs:["Si·Ge·GaAs 반도체 재료의 일반적 특성 이해","전자·정공 이론에 의한 전도 메커니즘",
         "n형·p형 반도체의 차이","무바이어스·순방향·역방향 다이오드 동작과 특성",
         "다이오드의 DC·AC·평균 AC 저항 계산","이상·실제 등가회로의 활용","제너 다이오드와 LED의 동작·특성"]},
  {n:2, ko:"다이오드 응용", en:"Diode Applications", pages:74, file:"pdfs/chapter2.pdf",
   objs:["부하선 해석(load-line analysis)과 다이오드 회로 적용","직렬·병렬·직병렬 다이오드 회로의 등가회로 해석",
         "정류(rectification) 과정 — AC 입력에서 DC 레벨 얻기","클리퍼·클램퍼 회로의 출력 응답 예측","제너 다이오드 해석과 응용 범위"]},
  {n:3, ko:"쌍극 접합 트랜지스터", en:"Bipolar Junction Transistors", pages:31, file:"pdfs/chapter3.pdf",
   objs:["BJT의 기본 구조와 동작 원리","활성 영역 동작을 위한 올바른 바이어싱",
         "npn·pnp 트랜지스터 특성의 이해와 설명","트랜지스터 응답을 결정하는 주요 파라미터","트랜지스터 테스트와 3단자 식별"]},
  {n:4, ko:"BJT의 DC 바이어싱", en:"DC Biasing — BJTs", pages:93, file:"pdfs/chapter4.pdf",
   objs:["주요 BJT 회로 구성의 DC 레벨 결정","BJT 회로의 전압 측정과 정상 동작 판별",
         "포화·차단 조건과 각 조건의 전압·전류 레벨","대표적 BJT 구성의 부하선 해석","BJT 증폭기 설계 과정",
         "트랜지스터 스위칭 회로의 기본 동작","BJT 회로의 고장 진단(troubleshooting)","안정도 계수(stability factor)와 환경 변화의 영향"]},
  {n:5, ko:"BJT 교류 해석", en:"BJT AC Analysis", pages:125, file:"pdfs/chapter5.pdf",
   objs:["BJT의 rₑ·하이브리드·하이브리드 π 모델","등가 모델을 이용한 증폭기 AC 파라미터 계산",
         "소스 저항·부하 저항이 전체 이득에 미치는 영향","주요 BJT 구성의 일반적인 AC 특성",
         "단일단·다단 증폭기의 2포트 시스템 접근","AC 증폭기 회로의 고장 진단"]},
];

/* 고정 자료 페이지 (모든 학생에게 보임) */
const MATERIALS = [
  {id:"semi-history", title:"반도체 발전사", sub:"진공관에서 2nm까지", icon:"📘"},
  {id:"electricity-flow", title:"전기는 흐르지 않는다", sub:"전자의 속도와 에너지의 정체", icon:"⚡"},
  {id:"atom-model", title:"원자모델", sub:"Atomic Models", icon:"⚛️"},
];

const LS_KEY = "elec-custom-pages-v1";
function loadPages(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||[];}catch(e){return [];} }
function savePages(p){ try{localStorage.setItem(LS_KEY, JSON.stringify(p));}catch(e){} }
let customPages = loadPages();

const LS_NOTICE = "elec-notices-v1";
function loadNotices(){ try{return JSON.parse(localStorage.getItem(LS_NOTICE))||[];}catch(e){return [];} }
function saveNotices(n){ try{localStorage.setItem(LS_NOTICE, JSON.stringify(n));}catch(e){} }
let notices = loadNotices();

let current = {type:"chapter", id:1};

/* ───────── 네비게이션 렌더 ───────── */
function renderNav(){
  const nNav = document.getElementById("noticeNav");
  nNav.innerHTML = "";
  const nb = document.createElement("button");

  });
  const cNav = document.getElementById("customNav");
  cNav.innerHTML = "";
  MATERIALS.forEach(m=>{
    const b = document.createElement("button");
    b.className = "nav-item" + (current.type==="material"&&current.id===m.id ? " active":"");
    b.innerHTML = `<span class="chip">${m.icon||"📘"}</span><span class="t">${m.title}<small>${m.sub}</small></span>`;
    b.onclick = ()=>{ current={type:"material",id:m.id}; render(); };
    cNav.appendChild(b);
  });
  customPages.forEach(p=>{
    const b = document.createElement("button");
    b.className = "nav-item" + (current.type==="custom"&&current.id===p.id ? " active":"");
    b.innerHTML = `<span class="chip">📎</span><span class="t">${esc(p.title)||"제목 없는 페이지"}</span><span class="del" title="페이지 삭제">✕</span>`;
    b.onclick = ()=>{ current={type:"custom",id:p.id}; render(); };
    b.querySelector(".del").onclick = (e)=>{ e.stopPropagation(); deletePage(p.id); };
    cNav.appendChild(b);
  });
}

function bindCustom(p){
  const upd = ()=>{ savePages(customPages); renderNav(); };
  document.getElementById("pgTitle").oninput = e=>{ p.title = e.target.value; upd(); };
  document.getElementById("pgMemo").oninput = e=>{ p.memo = e.target.value; savePages(customPages); };
  document.getElementById("pgDelete").onclick = ()=> deletePage(p.id);

  document.getElementById("ytAdd").onclick = ()=>{
    const url = document.getElementById("ytUrl").value.trim();
    const id = ytId(url);
    if(!id){ alert("유효한 유튜브 링크가 아닙니다."); return; }
    p.videos.push({url, id}); savePages(customPages); render();
  };
  document.getElementById("rdAdd").onclick = ()=>{
    const t = document.getElementById("rdTitle").value.trim();
    const u = document.getElementById("rdUrl").value.trim();

    p.readings.push({title:t, url:u.startsWith("http")?u:"https://"+u}); savePages(customPages); render();
  };
  document.querySelectorAll("[data-del-yt]").forEach(b=> b.onclick = ()=>{ p.videos.splice(+b.dataset.delYt,1); savePages(customPages); render(); });
  document.querySelectorAll("[data-del-rd]").forEach(b=> b.onclick = ()=>{ p.readings.splice(+b.dataset.delRd,1); savePages(customPages); render(); });
}

const VIZ = {ink:"#0b0b0b", sub:"#52514e", muted:"#898781", grid:"#e6e9f0", axis:"#c3c2b7", blue:"#2a78d6", accent:"#2f6bff"};

function logLineChart(cfg){
  const w=820, h=cfg.h||380, p={t:24,r:30,b:40,l:70};
  const iw=w-p.l-p.r, ih=h-p.t-p.b;
  const x = yr => p.l + (yr-cfg.x0)/(cfg.x1-cfg.x0)*iw;
  const y = v  => p.t + (Math.log10(cfg.y1)-Math.log10(v))/(Math.log10(cfg.y1)-Math.log10(cfg.y0))*ih;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${cfg.aria}">`;
  cfg.yTicks.forEach(t=>{
    s += `<line x1="${p.l}" y1="${y(t.v)}" x2="${w-p.r}" y2="${y(t.v)}" stroke="${VIZ.grid}" stroke-width="1"/>`;
    s += `<text x="${p.l-10}" y="${y(t.v)+4}" text-anchor="end" font-size="12" fill="${VIZ.muted}">${t.t}</text>`;
  });
  cfg.xTicks.forEach(t=>{
    s += `<text x="${x(t)}" y="${h-p.b+24}" text-anchor="middle" font-size="12" fill="${VIZ.muted}" font-variant-numeric="tabular-nums">${t}</text>`;
    s += `<line x1="${x(t)}" y1="${h-p.b}" x2="${x(t)}" y2="${h-p.b+6}" stroke="${VIZ.axis}" stroke-width="1"/>`;
  });
  s += `<line x1="${p.l}" y1="${h-p.b}" x2="${w-p.r}" y2="${h-p.b}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  s += `<path d="${cfg.pts.map((d,i)=>(i?"L":"M")+x(d.x).toFixed(1)+" "+y(d.y).toFixed(1)).join(" ")}" fill="none" stroke="${VIZ.blue}" stroke-width="2" stroke-linejoin="round"/>`;
  cfg.pts.forEach(d=>{
    const hl = d.hl;
    s += `<circle cx="${x(d.x).toFixed(1)}" cy="${y(d.y).toFixed(1)}" r="${hl?6:4}" fill="${hl?VIZ.accent:VIZ.blue}" stroke="#fff" stroke-width="2"><title>${d.x}년 · ${d.tip}</title></circle>`;
    if(d.lbl){
      const above = d.lpos!=="b";
      s += `<text x="${x(d.x).toFixed(1)}" y="${(y(d.y)+(above?-12:22)).toFixed(1)}" text-anchor="middle" font-size="${hl?13:11.5}" font-weight="${hl?800:600}" fill="${hl?VIZ.accent:VIZ.sub}">${d.lbl}</text>`;
    }
  });
  return s+"</svg>";
}

function scaleLadder(){
  const w=820, h=230, p={l:40,r:40}, axY=130;
  const x0=Math.log10(0.1), x1=Math.log10(200000);
  const x = v => p.l + (Math.log10(v)-x0)/(x1-x0)*(w-p.l-p.r);
  const ticks=[[0.1,"0.1nm"],[1,"1nm"],[10,"10nm"],[100,"100nm"],[1000,"1µm"],[10000,"10µm"],[100000,"0.1mm"]];
  const items=[
    {v:0.2, t:"실리콘 원자", d:"약 0.2nm", up:true},
    {v:2, t:"2nm 공정 노드", d:"최신 반도체", up:false, hl:true},
    {v:2.5, t:"DNA 폭", d:"약 2.5nm", up:true},
    {v:100, t:"바이러스", d:"약 100nm", up:false},
    {v:1000, t:"박테리아", d:"약 1µm", up:true},
    {v:7000, t:"적혈구", d:"약 7µm", up:false},
    {v:80000, t:"머리카락 굵기", d:"약 80µm", up:true},
  ];
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2나노미터 크기 비교">`;
  s += `<line x1="${p.l}" y1="${axY}" x2="${w-p.r}" y2="${axY}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  ticks.forEach(([v,t])=>{
    s += `<line x1="${x(v)}" y1="${axY-4}" x2="${x(v)}" y2="${axY+4}" stroke="${VIZ.axis}" stroke-width="1"/>`;
    s += `<text x="${x(v)}" y="${axY+40}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">${t}</text>`;
  });
  items.forEach(it=>{
    const cx=x(it.v), c=it.hl?VIZ.accent:VIZ.blue;
    const ly = it.up ? axY-52 : axY+62;
    s += `<line x1="${cx}" y1="${axY}" x2="${cx}" y2="${it.up?axY-34:axY+52}" stroke="${c}" stroke-width="1" stroke-dasharray="2 3"/>`;
    s += `<circle cx="${cx}" cy="${axY}" r="${it.hl?7:5}" fill="${c}" stroke="#fff" stroke-width="2"><title>${it.t} · ${it.d}</title></circle>`;
    s += `<text x="${cx}" y="${it.up?ly-14:ly}" text-anchor="middle" font-size="${it.hl?13:12}" font-weight="${it.hl?800:700}" fill="${it.hl?VIZ.accent:VIZ.ink}">${it.t}</text>`;
    s += `<text x="${cx}" y="${it.up?ly:ly+15}" text-anchor="middle" font-size="11" fill="${VIZ.sub}">${it.d}</text>`;
  });
  return s+"</svg>";
}

  const cx=[110,260,410,560,710];
  const names=["돌턴","톰슨","러더퍼드","보어","현재모형"];
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원자모형의 변천: 돌턴, 톰슨, 러더퍼드, 보어, 현재의 전자구름모형">`;
  s += `<defs>`;
  s += `<radialGradient id="amGray" cx="35%" cy="28%" r="75%"><stop offset="0" stop-color="#f4f4f4"/><stop offset="0.55" stop-color="#c4c4c4"/><stop offset="1" stop-color="#8d8d8d"/></radialGradient>`;
  s += `<radialGradient id="amBlue" cx="35%" cy="28%" r="75%"><stop offset="0" stop-color="#86d6f8"/><stop offset="0.5" stop-color="#2ba4e1"/><stop offset="1" stop-color="#0f6ba9"/></radialGradient>`;
  s += `<radialGradient id="amNuc" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffd28a"/><stop offset="0.6" stop-color="#f79a1e"/><stop offset="1" stop-color="#d97706"/></radialGradient>`;
  s += `<radialGradient id="amCloud" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1f7fc4" stop-opacity=".92"/><stop offset="0.42" stop-color="#2f9ad8" stop-opacity=".45"/><stop offset="0.75" stop-color="#7fc9ef" stop-opacity=".16"/><stop offset="1" stop-color="#7fc9ef" stop-opacity="0"/></radialGradient>`;
  s += `<filter id="amBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>`;
  s += `</defs>`;
  s += `<rect x="0" y="0" width="${w}" height="${h}" rx="16" fill="#f4f5f7"/>`;

  /* 상단 라벨과 진행 화살표 */
  names.forEach((n,i)=>{
    s += `<text x="${cx[i]}" y="40" text-anchor="middle" font-size="17" font-weight="800" fill="${VIZ.ink}">${n}</text>`;
    if(i<4){
      const ax=(cx[i]+cx[i+1])/2;
      s += `<path d="M${ax-14} 28 L${ax} 28 L${ax} 22 L${ax+14} 34 L${ax} 46 L${ax} 40 L${ax-14} 40 Z" fill="#f9b619"/>`;
    }
  });

  const gloss = c => `<ellipse cx="${c-19}" cy="${cy-25}" rx="19" ry="12" fill="#fff" opacity=".22"/>`;
  const elec = (x,y,rr) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr}" fill="#e8552d" stroke="#fff" stroke-width="1.2"/>`;

  /* ① 돌턴 — 단단한 공 */
  s += `<circle cx="${cx[0]}" cy="${cy}" r="${r}" fill="url(#amGray)"/>` + gloss(cx[0]);

  /* ② 톰슨 — 푸딩 모형 */
  s += `<circle cx="${cx[1]}" cy="${cy}" r="${r}" fill="url(#amBlue)"/>` + gloss(cx[1]);
  [[-30,-22],[6,-34],[32,-12],[-38,6],[-8,-2],[20,14],[-22,32],[10,36],[38,26]].forEach(([dx,dy])=>{
    s += elec(cx[1]+dx, cy+dy, 6);
  });

  /* ③ 러더퍼드 — 전자가 핵 주위를 도는 행성모형 */
  s += `<circle cx="${cx[2]}" cy="${cy}" r="${r}" fill="url(#amBlue)"/>` + gloss(cx[2]);
  [0,60,120].forEach(a=>{
    s += `<ellipse cx="${cx[2]}" cy="${cy}" rx="50" ry="19" fill="none" stroke="#eaf6ff" stroke-width="1.6" opacity=".85" transform="rotate(${a} ${cx[2]} ${cy})"/>`;
  });
  [[0,50,0],[60,-50,0],[120,50,0],[0,-50,0],[60,50,0],[120,-50,0]].forEach(([a,ox,oy],i)=>{
    const t=a*Math.PI/180;
    s += elec(cx[2]+ox*Math.cos(t)-oy*Math.sin(t), cy+ox*Math.sin(t)+oy*Math.cos(t), 5.5);
  });
  s += `<circle cx="${cx[2]}" cy="${cy}" r="16" fill="url(#amNuc)"/>`;
  s += `<text x="${cx[2]}" y="${cy+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">＋</text>`;

  /* ④ 보어 — 불연속적인 원궤도 */
  s += `<circle cx="${cx[3]}" cy="${cy}" r="${r}" fill="url(#amBlue)"/>` + gloss(cx[3]);
  [26,40,52].forEach(rr=>{
    s += `<circle cx="${cx[3]}" cy="${cy}" r="${rr}" fill="none" stroke="#eaf6ff" stroke-width="1.6" opacity=".85"/>`;
  });
  [[26,-55],[26,125],[40,20],[40,200],[52,-100],[52,70],[52,165]].forEach(([rr,a])=>{
    const t=a*Math.PI/180;
    s += elec(cx[3]+rr*Math.cos(t), cy+rr*Math.sin(t), 5.5);
  });
  s += `<circle cx="${cx[3]}" cy="${cy}" r="18" fill="url(#amNuc)"/>`;
  s += `<text x="${cx[3]}" y="${cy+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">＋</text>`;

  /* ⑤ 현재모형 — 전자구름 */
  s += `<circle cx="${cx[4]}" cy="${cy}" r="${r+4}" fill="url(#amCloud)" filter="url(#amBlur)"/>`;
  s += `<circle cx="${cx[4]}" cy="${cy}" r="7" fill="#f79a1e" opacity=".9"/>`;
  s += elec(cx[4]+30, cy-14, 6);
  return s+"</svg>";
}

const SPEEDS = [
  {v:7.4e-5, t:"전자 드리프트",   d:"약 0.07 mm/s",       up:true,  hl:true},
  {v:1.0e-3, t:"달팽이",          d:"약 1 mm/s",          up:false},

];

function speedLadder(){
  const w=820, h=250, p={l:58,r:58}, axY=138;
  const x0=Math.log10(1e-5), x1=Math.log10(1e9);
  const x = v => p.l + (Math.log10(v)-x0)/(x1-x0)*(w-p.l-p.r);
  const ticks=[[1e-4,"0.1mm/s"],[1e-2,"1cm/s"],[1,"1m/s"],[1e2,"100m/s"],[1e4,"10km/s"],[1e6,"1,000km/s"],[1e8,"10만km/s"]];
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전자의 드리프트 속도와 전기 신호 전파 속도 비교">`;
  s += `<line x1="${p.l}" y1="${axY}" x2="${w-p.r}" y2="${axY}" stroke="${VIZ.axis}" stroke-width="1.5"/>`;
  ticks.forEach(([v,t])=>{
    s += `<line x1="${x(v)}" y1="${axY-4}" x2="${x(v)}" y2="${axY+4}" stroke="${VIZ.axis}" stroke-width="1"/>`;
    s += `<text x="${x(v)}" y="${axY+40}" text-anchor="middle" font-size="11.5" fill="${VIZ.muted}">${t}</text>`;
  });
  SPEEDS.forEach(it=>{
    const cx=x(it.v), c=it.hl?VIZ.accent:VIZ.blue;
    const ly = it.up ? axY-52 : axY+62;
    s += `<line x1="${cx}" y1="${axY}" x2="${cx}" y2="${it.up?axY-34:axY+52}" stroke="${c}" stroke-width="1" stroke-dasharray="2 3"/>`;
    s += `<circle cx="${cx}" cy="${axY}" r="${it.hl?7:5}" fill="${c}" stroke="#fff" stroke-width="2"><title>${it.t} · ${it.d}</title></circle>`;
    s += `<text x="${cx}" y="${it.up?ly-14:ly}" text-anchor="middle" font-size="${it.hl?13:12}" font-weight="${it.hl?800:700}" fill="${it.hl?VIZ.accent:VIZ.ink}">${it.t}</text>`;
    s += `<text x="${cx}" y="${it.up?ly:ly+15}" text-anchor="middle" font-size="11" fill="${VIZ.sub}">${it.d}</text>`;
  });
  return s+"</svg>";
}

  s += `<text x="330" y="99" font-size="12.5" font-weight="700" fill="${VIZ.sub}">I (관용 전류)</text>`;
  s += `<line x1="600" y1="95" x2="530" y2="95" stroke="${VIZ.sub}" stroke-width="2" marker-end="url(#efB)"/>`;
  s += `<text x="610" y="99" font-size="12.5" font-weight="700" fill="${VIZ.sub}">e⁻ 약 0.07 mm/s</text>`;

  /* 범례 */
  s += `<text x="435" y="292" text-anchor="middle" font-size="12" fill="${VIZ.muted}">점선 화살표 = 전기장 E · ⊗ = 지면 안쪽으로 들어가는 자기장 B · 굵은 화살표 = 포인팅 벡터 S</text>`;

  return s+"</svg>";
}

/* ───────── 레이저 포인터 ───────── */
const laserBtn = document.getElementById("laserBtn");
const TRAIL_TTL = 420;   /* 꼬리 잔상 지속시간(ms) */
let laserOn = false, laserDot = null, laserCanvas = null, lctx = null, lpts = [], laserRaf = 0;

function laserResize(){
  if(!laserCanvas) return;
  const d = window.devicePixelRatio || 1;
  laserCanvas.width = innerWidth * d;
  laserCanvas.height = innerHeight * d;
  lctx.setTransform(d, 0, 0, d, 0, 0);
}

function laserTick(){
  if(!laserOn || !lctx) return;
  const now = performance.now();
  lpts = lpts.filter(p => now - p.t < TRAIL_TTL);
  lctx.clearRect(0, 0, innerWidth, innerHeight);
  const N = lpts.length;
  if(N > 1){
    /* 같은 경로를 여러 겹으로 — 머리쪽일수록 더 많은 패스가 겹쳐 굵고 진해짐 */
    lctx.lineCap = "round"; lctx.lineJoin = "round";
    lctx.strokeStyle = "rgba(255,58,58,0.13)";
    const passes = 6;
    for(let p = 0; p < passes; p++){
      const start = Math.floor((N - 1) * p / passes);
      lctx.lineWidth = 1.5 + p * 1.9;
      lctx.beginPath();
      lctx.moveTo(lpts[start].x, lpts[start].y);
      for(let i = start + 1; i < N; i++) lctx.lineTo(lpts[i].x, lpts[i].y);
      lctx.stroke();
    }
  }
  laserRaf = requestAnimationFrame(laserTick);
}

function setLaser(on){
  laserOn = on;
  document.body.classList.toggle("laser-on", on);
  laserBtn.classList.toggle("on", on);
  if(on){
    if(!laserDot){
      laserDot = document.createElement("div");
      laserDot.className = "laser-dot";
      laserDot.style.display = "none";
      document.body.appendChild(laserDot);
    }
    if(!laserCanvas){
      laserCanvas = document.createElement("canvas");
      laserCanvas.id = "laserCanvas";
      document.body.appendChild(laserCanvas);
      lctx = laserCanvas.getContext("2d");
      laserResize();
      addEventListener("resize", laserResize);
    }
    laserRaf = requestAnimationFrame(laserTick);
  }else{
    cancelAnimationFrame(laserRaf);
    removeEventListener("resize", laserResize);
    if(laserDot){ laserDot.remove(); laserDot = null; }
    if(laserCanvas){ laserCanvas.remove(); laserCanvas = null; lctx = null; }
    lpts = [];
  }
}
laserBtn.onclick = ()=> setLaser(!laserOn);

function laserMove(x, y){
  if(!laserOn || !laserDot) return;
  laserDot.style.display = "block";
  laserDot.style.left = x+"px";
  laserDot.style.top = y+"px";
  /* 펜슬은 touch/pointer 이벤트가 같은 좌표로 중복 발생 → 같은 점은 꼬리에 넣지 않음 */
  const last = lpts[lpts.length - 1];
  if(last && Math.abs(last.x - x) < 0.5 && Math.abs(last.y - y) < 0.5) return;
  lpts.push({x, y, t: performance.now()});
  if(lpts.length > 120) lpts.shift();
}

/* 애플 펜슬(스타일러스) = 레이저만 이동(스크롤 차단), 손가락 = 평소대로 스크롤 */
function isStylus(t){ return !!t && t.touchType === "stylus"; }
function onLaserBtn(el){ return !!(el && el.closest && el.closest("#laserBtn")); }

document.addEventListener("mousemove", e=> laserMove(e.clientX, e.clientY));

/* 펜슬 호버(지원 기기)에서도 포인터가 따라오도록 */
document.addEventListener("pointermove", e=>{
  if(laserOn && e.pointerType === "pen") laserMove(e.clientX, e.clientY);
});

/* passive:false 여야 preventDefault()로 스크롤을 막을 수 있다 */
document.addEventListener("touchstart", e=>{
  if(!laserOn) return;
  const t = e.touches[0];
  if(!isStylus(t) || onLaserBtn(e.target)) return;   /* 손가락·레이저 버튼은 그대로 */
  e.preventDefault();                                /* 스크롤 시작 자체를 차단 */
  laserMove(t.clientX, t.clientY);
}, {passive:false});

document.addEventListener("touchmove", e=>{
  if(!laserOn) return;
  const t = e.touches[0];
  if(!isStylus(t)) return;                           /* 손가락 스크롤은 유지 */
  e.preventDefault();
  laserMove(t.clientX, t.clientY);
}, {passive:false});
document.addEventListener("keydown", e=>{
  const tag = (document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA") return;
  if(e.key==="l"||e.key==="L") setLaser(!laserOn);
  if(e.key==="Escape" && laserOn) setLaser(false);
});

function ytId(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,20})/);
  return m ? m[1] : null;
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

render();
</script>
